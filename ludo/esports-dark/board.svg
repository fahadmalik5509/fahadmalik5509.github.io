<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660" font-family="Oxanium, sans-serif">
  <!-- ESPORTS DARK BOARD — geometry from board_layout_check.svg. Dark cells,
       neon cyan grid, glowing starts/safes, clipped feel. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="star"><path d="M0,-11 L3.1,-3.4 11,-3.4 4.6,1.7 6.8,9.5 0,4.7 -6.8,9.5 -4.6,1.7 -11,-3.4 -3.1,-3.4 Z" fill="#C6FF3D"/></g>
  </defs>

  <rect width="660" height="660" rx="8" fill="#0B0E13"/>
  <rect x="3" y="3" width="654" height="654" rx="6" fill="none" stroke="#00E5FF" stroke-opacity=".4" stroke-width="1.5"/>

  <!-- cross arms -->
  <rect x="270" y="30" width="120" height="600" fill="#10141C"/>
  <rect x="30" y="270" width="600" height="120" fill="#10141C"/>

  <!-- yards -->
  <g stroke-width="2" filter="url(#glow)">
    <rect x="34" y="34" width="232" height="232" rx="4" fill="#10211a" stroke="#2BE0A8"/>
    <rect x="394" y="34" width="232" height="232" rx="4" fill="#241019" stroke="#FF4D6D"/>
    <rect x="34" y="394" width="232" height="232" rx="4" fill="#241f10" stroke="#FFC93D"/>
    <rect x="394" y="394" width="232" height="232" rx="4" fill="#101a26" stroke="#3D9BFF"/>
  </g>
  <g stroke-width="2">
    <circle cx="115" cy="115" r="16" fill="#2BE0A8" filter="url(#glow)"/><circle cx="185" cy="115" r="16" fill="#2BE0A8" filter="url(#glow)"/><circle cx="115" cy="185" r="16" fill="#2BE0A8" filter="url(#glow)"/><circle cx="185" cy="185" r="16" fill="#2BE0A8" filter="url(#glow)"/>
    <circle cx="475" cy="115" r="16" fill="#FF4D6D" filter="url(#glow)"/><circle cx="545" cy="115" r="16" fill="#FF4D6D" filter="url(#glow)"/><circle cx="475" cy="185" r="16" fill="#FF4D6D" filter="url(#glow)"/><circle cx="545" cy="185" r="16" fill="#FF4D6D" filter="url(#glow)"/>
    <circle cx="115" cy="475" r="16" fill="#FFC93D" filter="url(#glow)"/><circle cx="185" cy="475" r="16" fill="#FFC93D" filter="url(#glow)"/><circle cx="115" cy="545" r="16" fill="#FFC93D" filter="url(#glow)"/><circle cx="185" cy="545" r="16" fill="#FFC93D" filter="url(#glow)"/>
    <circle cx="475" cy="475" r="16" fill="#3D9BFF" filter="url(#glow)"/><circle cx="545" cy="475" r="16" fill="#3D9BFF" filter="url(#glow)"/><circle cx="475" cy="545" r="16" fill="#3D9BFF" filter="url(#glow)"/><circle cx="545" cy="545" r="16" fill="#3D9BFF" filter="url(#glow)"/>
  </g>

  <!-- home columns -->
  <g stroke="#0B0E13" stroke-width="1">
    <rect x="70" y="310" width="40" height="40" fill="#2BE0A8"/><rect x="110" y="310" width="40" height="40" fill="#2BE0A8" opacity=".85"/><rect x="150" y="310" width="40" height="40" fill="#2BE0A8" opacity=".7"/><rect x="190" y="310" width="40" height="40" fill="#2BE0A8" opacity=".55"/><rect x="230" y="310" width="40" height="40" fill="#2BE0A8" opacity=".4"/>
    <rect x="310" y="70" width="40" height="40" fill="#FF4D6D"/><rect x="310" y="110" width="40" height="40" fill="#FF4D6D" opacity=".85"/><rect x="310" y="150" width="40" height="40" fill="#FF4D6D" opacity=".7"/><rect x="310" y="190" width="40" height="40" fill="#FF4D6D" opacity=".55"/><rect x="310" y="230" width="40" height="40" fill="#FF4D6D" opacity=".4"/>
    <rect x="590" y="310" width="40" height="40" fill="#3D9BFF"/><rect x="550" y="310" width="40" height="40" fill="#3D9BFF" opacity=".85"/><rect x="510" y="310" width="40" height="40" fill="#3D9BFF" opacity=".7"/><rect x="470" y="310" width="40" height="40" fill="#3D9BFF" opacity=".55"/><rect x="430" y="310" width="40" height="40" fill="#3D9BFF" opacity=".4"/>
    <rect x="310" y="590" width="40" height="40" fill="#FFC93D"/><rect x="310" y="550" width="40" height="40" fill="#FFC93D" opacity=".85"/><rect x="310" y="510" width="40" height="40" fill="#FFC93D" opacity=".7"/><rect x="310" y="470" width="40" height="40" fill="#FFC93D" opacity=".55"/><rect x="310" y="430" width="40" height="40" fill="#FFC93D" opacity=".4"/>
  </g>

  <!-- normal cells -->
  <g fill="#13171F" stroke="#00E5FF" stroke-opacity=".35" stroke-width="1.2">
    <rect x="270" y="510" width="40" height="40"/><rect x="270" y="470" width="40" height="40"/><rect x="270" y="430" width="40" height="40"/><rect x="270" y="390" width="40" height="40"/>
    <rect x="230" y="350" width="40" height="40"/><rect x="190" y="350" width="40" height="40"/><rect x="150" y="350" width="40" height="40"/><rect x="70" y="350" width="40" height="40"/><rect x="30" y="350" width="40" height="40"/>
    <rect x="30" y="270" width="40" height="40"/><rect x="110" y="270" width="40" height="40"/><rect x="150" y="270" width="40" height="40"/><rect x="190" y="270" width="40" height="40"/><rect x="230" y="270" width="40" height="40"/>
    <rect x="270" y="230" width="40" height="40"/><rect x="270" y="190" width="40" height="40"/><rect x="270" y="150" width="40" height="40"/><rect x="270" y="70" width="40" height="40"/><rect x="270" y="30" width="40" height="40"/>
    <rect x="350" y="30" width="40" height="40"/><rect x="350" y="110" width="40" height="40"/><rect x="350" y="150" width="40" height="40"/><rect x="350" y="190" width="40" height="40"/><rect x="350" y="230" width="40" height="40"/>
    <rect x="390" y="270" width="40" height="40"/><rect x="430" y="270" width="40" height="40"/><rect x="470" y="270" width="40" height="40"/><rect x="550" y="270" width="40" height="40"/><rect x="590" y="270" width="40" height="40"/>
    <rect x="590" y="350" width="40" height="40"/><rect x="510" y="350" width="40" height="40"/><rect x="470" y="350" width="40" height="40"/><rect x="430" y="350" width="40" height="40"/><rect x="390" y="350" width="40" height="40"/>
    <rect x="350" y="390" width="40" height="40"/><rect x="350" y="430" width="40" height="40"/><rect x="350" y="470" width="40" height="40"/><rect x="350" y="550" width="40" height="40"/><rect x="350" y="590" width="40" height="40"/>
    <rect x="270" y="590" width="40" height="40"/>
  </g>
  <!-- home-entry -->
  <g stroke="#0B0E13" stroke-width="1">
    <rect x="30" y="310" width="40" height="40" fill="#2BE0A8" fill-opacity=".5"/><rect x="310" y="30" width="40" height="40" fill="#FF4D6D" fill-opacity=".5"/>
    <rect x="590" y="310" width="40" height="40" fill="#3D9BFF" fill-opacity=".5"/><rect x="310" y="590" width="40" height="40" fill="#FFC93D" fill-opacity=".5"/>
  </g>
  <!-- starts -->
  <g stroke-width="2" filter="url(#glow)">
    <rect x="270" y="550" width="40" height="40" fill="#FFC93D" stroke="#FFC93D"/><rect x="70" y="270" width="40" height="40" fill="#2BE0A8" stroke="#2BE0A8"/>
    <rect x="350" y="70" width="40" height="40" fill="#FF4D6D" stroke="#FF4D6D"/><rect x="550" y="350" width="40" height="40" fill="#3D9BFF" stroke="#3D9BFF"/>
  </g>
  <!-- safes -->
  <g fill="#13171F" stroke="#C6FF3D" stroke-width="1.6">
    <rect x="110" y="350" width="40" height="40"/><rect x="270" y="110" width="40" height="40"/><rect x="510" y="270" width="40" height="40"/><rect x="350" y="510" width="40" height="40"/>
  </g>
  <g filter="url(#glow)"><use href="#star" x="130" y="370"/><use href="#star" x="290" y="130"/><use href="#star" x="530" y="290"/><use href="#star" x="370" y="530"/></g>

  <!-- centre -->
  <g stroke="#0B0E13" stroke-width="2" stroke-linejoin="round" filter="url(#glow)">
    <path d="M270,270 L390,270 L330,330 Z" fill="#FF4D6D"/>
    <path d="M270,270 L270,390 L330,330 Z" fill="#2BE0A8"/>
    <path d="M390,270 L390,390 L330,330 Z" fill="#3D9BFF"/>
    <path d="M270,390 L390,390 L330,330 Z" fill="#FFC93D"/>
  </g>
  <circle cx="330" cy="330" r="29" fill="#0B0E13" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
  <text x="330" y="339" text-anchor="middle" font-size="24" fill="#00E5FF">♛</text>
</svg>
