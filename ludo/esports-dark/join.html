<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Join Room</title>
<link rel="stylesheet" href="styles.css">
<style>
  .join{justify-content:center;align-items:center;text-align:center}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px;margin-top:6px}
  .keypad button{font-family:'Fraunces',serif;font-weight:800;font-size:22px;color:var(--ink);background:var(--patch-2);
    border:none;border-radius:var(--r-md);padding:16px 0;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .keypad button.fn{background:var(--cloth-d);color:var(--patch);font-size:18px}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <a class="bare" href="home.html"><button class="iconbtn">←</button></a>
    <div class="title">Join Room</div><div class="spacer"></div>
  </div>
  <div class="content join">
    <div class="float" style="font-size:54px">🔑</div>
    <div class="title on-cloth">Enter room code</div>
    <p class="body light">Ask the host for their 5-character code.</p>

    <div class="otp" id="otp">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <div class="keypad" id="pad">
      <button>A</button><button>B</button><button>C</button>
      <button>D</button><button>E</button><button>K</button>
      <button>L</button><button>U</button><button>7</button>
      <button class="fn" data-k="del">⌫</button><button>0</button><button class="fn" data-k="clr">clr</button>
    </div>

    <a class="bare" href="game.html" id="joinlink" style="width:100%;max-width:300px;pointer-events:none;opacity:.5">
      <button class="btn btn-primary lg block" id="joinbtn" disabled>Join</button></a>
  </div>
</div>
<script>
  const cells=[...document.querySelectorAll('#otp .cell')]; let val='';
  function paint(){cells.forEach((c,i)=>{c.textContent=val[i]||'';c.classList.toggle('on',!!val[i]);});
    const ok=val.length===5; const lnk=document.getElementById('joinlink');
    lnk.style.pointerEvents=ok?'auto':'none'; lnk.style.opacity=ok?'1':'.5';
    document.getElementById('joinbtn').disabled=!ok;}
  document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k; if(k==='del')val=val.slice(0,-1); else if(k==='clr')val=''; else if(val.length<5)val+=b.textContent;
    paint();});
  paint();
</script>
</body>
</html>
