<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Profile</title>
<link rel="stylesheet" href="styles.css">
<style>
  .phead{position:relative;margin:6px 16px 0;overflow:hidden}
  .phead .row1{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
  .phead .nm h1{font-family:'Fraunces';font-weight:900;font-size:26px;color:var(--patch);line-height:.95}
  .phead .nm .tag{font-weight:800;font-size:12px;color:var(--turmeric);margin-top:6px;letter-spacing:1px}
  .lvlbar{margin-top:16px;position:relative;z-index:2}
  .lvlbar .lab{display:flex;justify-content:space-between;font-weight:800;font-size:11px;text-transform:uppercase;
    color:rgba(251,231,210,.7);margin-bottom:6px}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
  .stat{position:relative;background:var(--patch);border-radius:var(--r-md);padding:13px;text-align:center;box-shadow:var(--e1)}
  .stat::after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--cloth);border-radius:10px;opacity:.3}
  .stat .v{font-family:'Fraunces';font-weight:900;font-size:24px;color:var(--ink)}
  .stat .k{font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-muted);margin-top:2px}
  .ach{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px}
  .medal{flex:none;width:76px;text-align:center}
  .medal .disc{width:60px;height:60px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:28px;
    box-shadow:var(--e1);outline:2px dashed var(--patch);outline-offset:-5px}
  .medal .l{font-size:10px;font-weight:800;text-transform:uppercase;margin-top:6px;color:var(--patch)}
  .medal.lock .disc{background:var(--patch-2)!important;filter:grayscale(1);opacity:.65}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top" style="padding-bottom:6px">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Profile</div>
    <a class="bare" href="settings.html"><button class="ibtn" style="margin-left:auto">⚙</button></a>
  </div>

  <div class="scroll">
    <div class="phead patch cloth">
      <div class="row1">
        <div class="avatar" style="--sz:74px;--ring:var(--turmeric)"><div class="ring"><div class="crown">👑</div><div class="face">🦚</div></div></div>
        <div class="nm grow">
          <h1>Mayura</h1>
          <div class="tag">⭐ GOLD TIER · LVL 12</div>
        </div>
        <a class="bare" href="customize.html"><button class="ibtn">✏</button></a>
      </div>
      <div class="lvlbar">
        <div class="lab"><span>Level 12</span><span>2,340 / 3,000 XP</span></div>
        <div class="progress"><div class="fill" style="width:78%"></div></div>
      </div>
    </div>

    <div class="statgrid">
      <div class="stat reveal-pop" style="--d:.05s"><div class="v">148</div><div class="k">Games</div></div>
      <div class="stat reveal-pop" style="--d:.1s"><div class="v">92</div><div class="k">Wins</div></div>
      <div class="stat reveal-pop" style="--d:.15s"><div class="v">62%</div><div class="k">Win rate</div></div>
      <div class="stat reveal-pop" style="--d:.2s"><div class="v">×7</div><div class="k">Best streak</div></div>
      <div class="stat reveal-pop" style="--d:.25s"><div class="v">311</div><div class="k">Captures</div></div>
      <div class="stat reveal-pop" style="--d:.3s"><div class="v">12.4k</div><div class="k">Coins</div></div>
    </div>

    <div class="pad" style="padding-bottom:8px"><span class="kicker light">Achievements</span></div>
    <div class="ach">
      <div class="medal"><div class="disc" style="background:var(--turmeric)">🥇</div><div class="l">First Win</div></div>
      <div class="medal"><div class="disc" style="background:var(--madder)">🔥</div><div class="l">Streak 5</div></div>
      <div class="medal"><div class="disc" style="background:var(--indigo)">🎯</div><div class="l">100 Caps</div></div>
      <div class="medal lock"><div class="disc">🏆</div><div class="l">Champion</div></div>
      <div class="medal lock"><div class="disc">💎</div><div class="l">Big Spender</div></div>
    </div>
    <div style="height:16px"></div>
  </div>

  <div class="nav">
    <a href="home.html"><span class="ic">🏡</span>Home</a>
    <a href="friends.html"><span class="ic">🧶</span>Friends</a>
    <a href="customize.html"><span class="ic">🎨</span>Shop</a>
    <a class="on" href="profile.html"><span class="ic">🦚</span>You</a>
  </div>
</div>
</body>
</html>
