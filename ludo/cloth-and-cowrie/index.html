<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Cloth & Cowrie · Flow</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{display:block;background:#481622;
    background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 5px)}
  .hub{max-width:1080px;margin:0 auto;padding:44px 22px 110px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:18px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;margin-top:38px}
  .tile{display:block;text-decoration:none;color:var(--ink);background:var(--patch);background-image:var(--weave-light);
    border-radius:var(--r-lg);box-shadow:var(--e2);overflow:hidden;position:relative;transition:transform .2s}
  .tile::before{content:"";position:absolute;inset:9px;border:2px dashed var(--cloth);border-radius:14px;opacity:.4;pointer-events:none;z-index:2}
  .tile:hover{transform:translateY(-5px)}
  .tile .frame{aspect-ratio:1.5;display:grid;place-items:center;font-size:48px;background:var(--cloth-d);background-image:var(--weave);
    border-bottom:2px dashed rgba(251,231,210,.35)}
  .tile .meta{padding:14px 16px}
  .tile .meta .n{font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint)}
  .tile .meta .t{font-family:'Fraunces',serif;font-weight:900;font-size:18px;margin-top:2px}
  .topbtn{font-family:'Karla';font-weight:800;text-decoration:none;color:var(--ink);background:var(--turmeric);
    border-radius:var(--r-pill);padding:11px 18px;display:inline-block;box-shadow:var(--e1)}
</style>
</head>
<body>
<div class="hub">
  <div class="head">
    <div>
      <span class="kicker">Design system · Cloth &amp; Cowrie</span>
      <h1 class="display" style="font-size:64px;margin-top:16px">Throw the<br><em>cowries.</em></h1>
      <p class="body light" style="max-width:540px;margin-top:14px">A full Ludo flow drawn from Pachisi — the embroidered cross-cloth played not with a die but a fistful of cowrie shells. Kantha stitch, dyed cloth, calico patches. Every screen below is a real mock.</p>
    </div>
    <a class="topbtn" href="components.html">Components →</a>
  </div>
  <div class="tiles" id="tiles"></div>
</div>
<script>
  const S=[
    ['splash','Splash','🐚','00'],['login','Login','🪡','01'],['home','Home','🏡','02'],
    ['matchmaking','Matchmaking','🔮','03'],['team-lobby','Team Lobby','🤝','04'],['private-room','Private Room','🚪','05'],
    ['join','Join by Code','🧵','06'],['local-setup','Pass & Play','📿','07'],['game','Game Board','🎯','08'],
    ['results','Results','🏆','09'],['friends','Friends','🧶','10'],['profile','Profile','🦚','11'],
    ['customize','Customize','🎨','12'],['settings','Settings','⚙','13'],['no-internet','No Internet','📵','14'],
  ];
  document.getElementById('tiles').innerHTML=S.map((s,i)=>
    `<a class="tile reveal-pop" style="--d:${i*0.04}s" href="${s[0]}.html">
      <div class="frame">${s[2]}</div>
      <div class="meta"><div class="n">Screen ${s[3]}</div><div class="t">${s[1]}</div></div>
    </a>`).join('');
</script>
</body>
</html>
