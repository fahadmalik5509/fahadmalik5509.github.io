<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Join by Code</title>
<link rel="stylesheet" href="styles.css">
<style>
  .joinzone{flex:1;display:flex;flex-direction:column;padding:20px 18px 24px}
  .otp .cell{width:54px;height:68px;font-size:32px}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto}
  .keypad button{font-family:'Fraunces';font-weight:900;font-size:24px;color:var(--ink);background:var(--patch-2);
    border:none;border-radius:var(--r-md);padding:16px 0;cursor:pointer;box-shadow:var(--e1);transition:transform .1s}
  .keypad button:active{transform:translateY(3px)}
  .keypad button.fn{background:var(--turmeric)}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Join by Code</div>
  </div>

  <div class="joinzone">
    <div style="text-align:center">
      <div class="avatar" style="--sz:74px;--ring:var(--turmeric);margin:0 auto" ><div class="ring float"><div class="face">🧵</div></div></div>
      <h1 class="display reveal" style="font-size:38px;margin-top:14px">Enter the<br><em>room code</em></h1>
      <p class="body light reveal" style="--d:.1s;margin-top:8px">Ask the host for their 5-character code.</p>
    </div>

    <div class="otp" id="otp" style="margin-top:24px">
      <div class="cell cur"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="cap light" id="msg" style="text-align:center;margin-top:14px;min-height:14px"></div>

    <div class="keypad" id="pad">
      <button>A</button><button>B</button><button>C</button>
      <button>D</button><button>E</button><button>F</button>
      <button>K</button><button>L</button><button>U</button>
      <button>7</button><button>0</button><button class="fn" data-k="del">⌫</button>
    </div>

    <a class="bare" href="game.html" id="link" style="pointer-events:none;opacity:.45;margin-top:14px"><button class="btn btn-primary lg block" id="go" disabled>Join Room</button></a>
  </div>
</div>
<script>
  const cells=[...document.querySelectorAll('#otp .cell')]; let val=''; const msg=document.getElementById('msg');
  function paint(){
    cells.forEach((c,i)=>{c.textContent=val[i]||'';c.classList.toggle('on',!!val[i]);c.classList.toggle('cur',i===val.length)});
    const ok=val.length===5,l=document.getElementById('link'),b=document.getElementById('go');
    l.style.pointerEvents=ok?'auto':'none';l.style.opacity=ok?'1':'.45';b.disabled=!ok;
    msg.textContent=ok?'✓ code looks good':'';
  }
  document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.k==='del')val=val.slice(0,-1);else if(val.length<5)val+=b.textContent;paint();});
  paint();
</script>
</body>
</html>
