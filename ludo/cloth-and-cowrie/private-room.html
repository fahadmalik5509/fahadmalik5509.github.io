<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Private Room</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* rail + detail + pinned footer (mirrors the app's PrivateRoomScreen) */
  .pr-body{flex:1;display:flex;min-height:0}
  .rail{width:96px;flex:none;border-right:2px solid rgba(255,255,255,.14);overflow-y:auto;padding:10px 8px 16px}
  .railitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 2px;border-radius:var(--r-lg);
    cursor:pointer;color:rgba(255,255,255,.62);text-align:center;margin-bottom:6px;transition:background .12s,color .12s}
  .railitem .em{font-size:21px}
  .railitem .nm{font-size:11px;font-weight:800;letter-spacing:.2px;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .railitem.on{background:var(--turmeric);color:var(--ink)}
  .railitem.newm{border:2px solid rgba(255,255,255,.25);color:rgba(255,255,255,.6)}
  .detail{flex:1;overflow-y:auto;padding:18px 16px 20px}
  .detail .em{font-size:44px;line-height:1}
  .detail .head{display:flex;align-items:center;gap:9px;margin-top:6px}
  .detail .head .nm{margin:0}
  .rules{margin-top:16px}
  .rule{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1.5px solid rgba(255,255,255,.1)}
  .rule:last-child{border-bottom:none}
  .rule .ic{width:22px;text-align:center;font-size:14px;flex:none}
  .rule span{color:rgba(255,255,255,.86);font-weight:600;font-size:14px;line-height:1.4}
  .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .pillbtn{display:inline-flex;align-items:center;gap:7px;border:2px solid rgba(255,255,255,.25);color:var(--turmeric);
    font-weight:800;font-size:13px;padding:9px 15px;border-radius:var(--r-pill);background:none;cursor:pointer;font-family:inherit}
  /* footer */
  .pr-footer{border-top:2px solid rgba(255,255,255,.14);background:var(--cloth-d);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .teamrow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:11px 14px;margin-bottom:12px}
  .teamrow .t b{color:var(--patch);font-weight:800;font-size:14px;display:block}
  .teamrow .t span{color:rgba(255,255,255,.55);font-size:11.5px;font-weight:700}
  .joinrow{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;padding:13px;
    border-radius:var(--r-md);border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--patch);
    font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .joinrow small{color:rgba(255,255,255,.55);font-weight:700}
  /* join sheet */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--cloth);border-top:3px solid var(--turmeric);
    border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);
    transition:transform .32s cubic-bezier(.2,.8,.3,1)}
  .app.open .scrim{opacity:1;pointer-events:auto}
  .app.open .sheet{transform:none}
  .grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:0 auto 14px}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .keypad button{font-family:inherit;font-weight:800;font-size:19px;color:var(--ink);background:var(--patch-2);border:none;
    border-radius:var(--r-md);padding:13px 0;cursor:pointer}
  .keypad button.fn{background:rgba(255,255,255,.1);color:var(--patch)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="appbar">
    <a class="bare" href="home.html"><button class="iconbtn">←</button></a>
    <div class="title">Online</div><div class="spacer"></div>
  </div>

  <div class="pr-body">
    <!-- LEFT: mode selection rail -->
    <div class="rail" id="rail">
      <div class="railitem on" data-mode="classic"><span class="em">🎲</span><span class="nm">Classic</span></div>
      <div class="railitem" data-mode="blitz"><span class="em">⚡</span><span class="nm">Blitz</span></div>
      <div class="railitem" data-mode="rush"><span class="em">🐎</span><span class="nm">Rush</span></div>
      <div class="railitem newm" data-mode="new"><span class="em">＋</span><span class="nm">New</span></div>
    </div>

    <!-- RIGHT: selected mode rules -->
    <div class="detail" id="detail"><!-- rendered by JS --></div>
  </div>

  <!-- FOOTER -->
  <div class="pr-footer">
    <div class="teamrow">
      <span style="font-size:20px">🤝</span>
      <div class="t grow"><b>Team mode</b><span>2 v 2 · diagonal partners</span></div>
      <label class="toggle"><input type="checkbox" id="team"><span class="track"></span><span class="knob"></span></label>
    </div>
    <a class="bare" href="game.html"><button class="btn btn-primary lg block">＋ Create Room</button></a>
    <button class="joinrow" id="openjoin">🔑 Have a code? <small>Join game</small></button>
  </div>

  <!-- JOIN SHEET -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="title on-cloth" style="text-align:center">Join Game</div>
    <p class="body light" style="text-align:center;margin-top:4px">Enter the host's 5-character code.</p>
    <div class="otp" id="otp" style="margin-top:14px">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="keypad" id="pad">
      <button>A</button><button>B</button><button>C</button>
      <button>D</button><button>E</button><button>K</button>
      <button>L</button><button>U</button><button>7</button>
      <button class="fn" data-k="del">⌫</button><button>0</button><button class="fn" data-k="clr">clr</button>
    </div>
    <a class="bare" href="game.html" id="joinlink" style="pointer-events:none;opacity:.5"><button class="btn btn-primary block" id="joinbtn" disabled>Enter code</button></a>
  </div>
</div>

<script>
  const MODES={
    classic:{em:'🎲',name:'Classic',badge:'',rules:[
      ['🏁','All 4 tokens home'],['🎲','Unlock on 6'],['🎯','Capture → yard'],
      ['🔁','Roll again on 6'],['➕','+1 roll per capture']]},
    blitz:{em:'⚡',name:'Blitz',badge:'',rules:[
      ['🏁','2 of 4 tokens home'],['🎲','Unlock on 1 / 6'],['🚪','1 token starts on the board'],
      ['🎯','Capture → yard'],['🔁','Roll again on 6']]},
    rush:{em:'🐎',name:'Rush',badge:'CUSTOM',rules:[
      ['🏁','First token home wins'],['🎲','Unlock on 5 / 6'],['🎯','Capture → jail (escape on 6)'],
      ['🎰','Two dice per turn'],['🔥','Must capture when able']]},
  };
  const detail=document.getElementById('detail');
  function render(id){
    if(id==='new'){ detail.innerHTML='<div class="em">＋</div><div class="head"><div class="title">New mode</div></div>'+
      '<p class="body" style="color:rgba(255,255,255,.7);margin-top:10px">Fork a built-in and tweak the rules — capture, unlock, dice, bonuses and win condition.</p>'+
      '<div class="acts"><button class="pillbtn">🛠 Build rules</button></div>'; return; }
    const m=MODES[id];
    const badge=m.badge?'<span class="badge gold">CUSTOM</span>':'<span style="font-size:15px;opacity:.6">🔒</span>';
    const acts=m.badge
      ? '<button class="pillbtn">⚙ Edit rules</button><button class="pillbtn">🗑 Delete</button>'
      : '<button class="pillbtn">👁 View rules</button>';
    detail.innerHTML='<div class="em">'+m.em+'</div>'+
      '<div class="head"><div class="title">'+m.name+'</div>'+badge+'</div>'+
      '<div class="rules">'+m.rules.map(r=>'<div class="rule"><span class="ic">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'</div>'+
      '<div class="acts">'+acts+'</div>';
  }
  document.getElementById('rail').addEventListener('click',e=>{
    const it=e.target.closest('.railitem'); if(!it)return;
    document.querySelectorAll('.railitem').forEach(x=>x.classList.remove('on'));
    it.classList.add('on'); render(it.dataset.mode);
  });
  render('classic');

  // join sheet
  const app=document.getElementById('app');
  document.getElementById('openjoin').onclick=()=>app.classList.add('open');
  document.getElementById('scrim').onclick=()=>app.classList.remove('open');
  const cells=[...document.querySelectorAll('#otp .cell')]; let val='';
  function paint(){cells.forEach((c,i)=>{c.textContent=val[i]||'';c.classList.toggle('on',!!val[i])});
    const ok=val.length===5,l=document.getElementById('joinlink'),b=document.getElementById('joinbtn');
    l.style.pointerEvents=ok?'auto':'none';l.style.opacity=ok?'1':'.5';b.disabled=!ok;b.textContent=ok?'Join Room':'Enter code';}
  document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k; if(k==='del')val=val.slice(0,-1);else if(k==='clr')val='';else if(val.length<5)val+=b.textContent;paint();});
  paint();
</script>
</body>
</html>
