<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Private Room</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pr-body{flex:1;display:flex;min-height:0}
  .rail{width:96px;flex:none;border-right:2px dashed rgba(251,231,210,.3);overflow-y:auto;padding:12px 8px 16px}
  .railitem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;cursor:pointer;text-align:center;
    margin-bottom:8px;border-radius:var(--r-md);color:rgba(251,231,210,.65);transition:.15s}
  .railitem .em{font-size:22px}
  .railitem .nm{font-weight:800;font-size:11px;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .railitem.on{background:var(--turmeric);color:var(--ink);box-shadow:var(--e1)}
  .railitem.newm{border:2px dashed rgba(251,231,210,.4)}
  .detail{flex:1;overflow-y:auto;padding:18px 16px 20px}
  .detail .em{font-size:46px;line-height:1}
  .detail .head{display:flex;align-items:center;gap:10px;margin-top:8px}
  .rules{margin-top:16px}
  .rule{position:relative;display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:2px dashed rgba(251,231,210,.18)}
  .rule:last-child{border-bottom:none}
  .rule .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--patch);font-size:15px}
  .rule span{color:rgba(251,231,210,.9);font-weight:700;font-size:14px;line-height:1.4;padding-top:6px}
  .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .pr-footer{border-top:2px dashed rgba(251,231,210,.3);background:var(--cloth-d);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .teamrow{display:flex;align-items:center;gap:12px;background:rgba(251,231,210,.08);border-radius:var(--r-md);padding:11px 13px;margin-bottom:12px}
  .teamrow .t b{color:var(--patch);font-family:'Fraunces';font-weight:700;font-size:15px;display:block}
  .teamrow .t span{color:rgba(251,231,210,.6);font-size:11.5px;font-weight:700}
  .joinrow{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;padding:13px;
    border-radius:var(--r-md);border:2px dashed rgba(251,231,210,.35);background:rgba(251,231,210,.05);color:var(--turmeric);
    font-weight:800;font-size:14px;cursor:pointer;font-family:'Karla',sans-serif}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .keypad button{font-family:'Fraunces';font-weight:900;font-size:20px;color:var(--ink);background:var(--patch-2);border:none;
    border-radius:var(--r-md);padding:14px 0;cursor:pointer}
  .keypad button.fn{background:rgba(251,231,210,.12);color:var(--turmeric)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Private Room</div>
  </div>

  <div class="pr-body">
    <div class="rail" id="rail">
      <div class="railitem on" data-mode="classic"><span class="em">🎲</span><span class="nm">Classic</span></div>
      <div class="railitem" data-mode="blitz"><span class="em">⚡</span><span class="nm">Blitz</span></div>
      <div class="railitem" data-mode="rush"><span class="em">🐎</span><span class="nm">Rush</span></div>
      <div class="railitem newm" data-mode="new"><span class="em">＋</span><span class="nm">New</span></div>
    </div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="pr-footer">
    <div class="teamrow">
      <span style="font-size:22px">🤝</span>
      <div class="t grow"><b>Team mode</b><span>2 v 2 · diagonal partners</span></div>
      <label class="toggle"><input type="checkbox" id="team"><span class="track"></span><span class="knob"></span></label>
    </div>
    <a class="bare" href="game.html"><button class="btn btn-primary lg block">＋ Create Room</button></a>
    <button class="joinrow" id="openjoin">🧵 Have a code? · Join game</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="title on-cloth" style="text-align:center;font-size:24px">Join game</div>
    <p class="body light" style="text-align:center;margin-top:6px">Enter the host's 5-character code.</p>
    <div class="otp" id="otp" style="margin-top:16px">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="keypad" id="pad">
      <button>A</button><button>B</button><button>C</button>
      <button>D</button><button>E</button><button>K</button>
      <button>L</button><button>U</button><button>7</button>
      <button class="fn" data-k="del">⌫</button><button>0</button><button class="fn" data-k="clr">clr</button>
    </div>
    <a class="bare" href="game.html" id="joinlink" style="pointer-events:none;opacity:.45"><button class="btn btn-success block" id="joinbtn" disabled>Enter code</button></a>
  </div>
</div>
<script>
  const MODES={
    classic:{em:'🎲',name:'Classic',badge:'',rules:[
      ['🏁','All 4 tokens home to win'],['🐚','Unlock a token on a 6'],['🎯','Land on a foe → send to yard'],
      ['🔁','Throw again on a 6'],['➕','+1 bonus throw per capture']]},
    blitz:{em:'⚡',name:'Blitz',badge:'',rules:[
      ['🏁','First 2 tokens home wins'],['🐚','Unlock on 1 or 6'],['🚪','1 token starts on the board'],
      ['🎯','Capture → yard'],['🔁','Throw again on a 6']]},
    rush:{em:'🐎',name:'Rush',badge:'CUSTOM',rules:[
      ['🏁','First token home wins'],['🐚','Unlock on 5 or 6'],['🚔','Capture → jail (escape on 6)'],
      ['🎰','Two throws every turn'],['🔥','Must capture when able']]},
  };
  const detail=document.getElementById('detail');
  function render(id){
    if(id==='new'){ detail.innerHTML='<div class="em">＋</div><div class="head"><div class="title on-cloth">New mode</div></div>'+
      '<p class="body light" style="margin-top:12px">Fork a built-in and tweak the rules — capture, unlock, throw count, bonuses and win condition.</p>'+
      '<div class="acts"><button class="btn btn-accent sm">🛠 Build rules</button></div>'; return; }
    const m=MODES[id];
    const badge=m.badge?'<span class="badge gold">CUSTOM</span>':'<span class="chip light">built-in</span>';
    const acts=m.badge?'<button class="btn btn-ghost sm">⚙ Edit</button><button class="btn btn-primary sm">🗑 Delete</button>':'<button class="btn btn-ghost sm">👁 View rules</button>';
    detail.innerHTML='<div class="em reveal-pop">'+m.em+'</div>'+
      '<div class="head"><div class="title on-cloth">'+m.name+'</div>'+badge+'</div>'+
      '<div class="rules">'+m.rules.map((r,i)=>'<div class="rule reveal" style="--d:'+(i*0.04)+'s"><span class="ic">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'</div>'+
      '<div class="acts">'+acts+'</div>';
  }
  document.getElementById('rail').addEventListener('click',e=>{
    const it=e.target.closest('.railitem'); if(!it)return;
    document.querySelectorAll('.railitem').forEach(x=>x.classList.remove('on'));
    it.classList.add('on'); render(it.dataset.mode);
  });
  render('classic');

  const app=document.getElementById('app');
  document.getElementById('openjoin').onclick=()=>app.classList.add('open');
  document.getElementById('scrim').onclick=()=>app.classList.remove('open');
  const cells=[...document.querySelectorAll('#otp .cell')]; let val='';
  function paint(){cells.forEach((c,i)=>{c.textContent=val[i]||'';c.classList.toggle('on',!!val[i])});
    const ok=val.length===5,l=document.getElementById('joinlink'),b=document.getElementById('joinbtn');
    l.style.pointerEvents=ok?'auto':'none';l.style.opacity=ok?'1':'.45';b.disabled=!ok;b.textContent=ok?'Join Room':'Enter code';}
  document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k; if(k==='del')val=val.slice(0,-1);else if(k==='clr')val='';else if(val.length<5)val+=b.textContent;paint();});
  paint();
</script>
</body>
</html>
