<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Customize</title>
<link rel="stylesheet" href="styles.css">
<style>
  .catbar{display:flex;gap:8px;padding:12px 16px 6px;overflow-x:auto}
  .cat{flex:none;font-weight:800;font-size:12px;border:2px dashed var(--cloth);background:var(--patch-2);
    color:var(--cloth);padding:9px 14px;border-radius:var(--r-pill);cursor:pointer;display:flex;align-items:center;gap:6px}
  .cat.on{background:var(--turmeric);border-style:solid;color:var(--ink)}
  .preview{margin:6px 16px 0;background:var(--cloth-d);background-image:var(--weave);border-radius:var(--r-lg);
    padding:26px;display:grid;place-items:center;min-height:130px;position:relative}
  .preview::before{content:"";position:absolute;inset:9px;border:2px dashed rgba(251,231,210,.4);border-radius:14px}
  .grid-items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 16px}
  .item{position:relative;background:var(--patch);border-radius:var(--r-md);padding:14px 8px;display:flex;flex-direction:column;
    align-items:center;gap:8px;cursor:pointer;box-shadow:var(--e1);transition:transform .15s}
  .item::after{content:"";position:absolute;inset:6px;border:1.5px dashed var(--cloth);border-radius:10px;opacity:.3;pointer-events:none}
  .item:hover{transform:translateY(-3px)}
  .item.on{background:var(--turmeric)}
  .item .nm{font-family:'Fraunces';font-weight:700;font-size:12px}
  .item .price{font-weight:800;font-size:11px;color:var(--ink-muted)}
  .item .tick{position:absolute;top:-7px;right:-7px;width:24px;height:24px;background:var(--leaf);border-radius:50%;
    display:grid;place-items:center;font-size:13px;color:#fff;z-index:3}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="profile.html"><button class="ibtn">←</button></a>
    <div class="ti">Customize</div>
    <span class="pill" style="margin-left:auto"><span class="ic">🪙</span> 12,450</span>
  </div>

  <div class="catbar" id="catbar">
    <div class="cat on" data-c="cowrie">🐚 Cowries</div>
    <div class="cat" data-c="token">⬤ Tokens</div>
    <div class="cat" data-c="dice">🎲 Dice</div>
    <div class="cat" data-c="avatar">🦚 Avatar</div>
    <div class="cat" data-c="board">🗺 Board</div>
    <div class="cat" data-c="color">🎨 Name</div>
  </div>

  <div class="preview" id="preview"></div>

  <div class="scroll">
    <div class="grid-items" id="items"></div>
  </div>

  <div class="pad" style="border-top:2px dashed rgba(251,231,210,.3)">
    <button class="btn btn-primary lg block" id="equip">Equip</button>
  </div>
</div>
<script>
  const COWRIE=[
    {nm:'Ivory',html:'<div class="row gap-8" style="--csz:30px"><div class="cowrie up"></div><div class="cowrie down"></div><div class="cowrie up lit"></div></div>',price:'OWNED',on:1},
    {nm:'Gilded',html:'<div class="row gap-8" style="--csz:30px"><div class="cowrie up lit"></div><div class="cowrie up lit"></div><div class="cowrie up lit"></div></div>',price:'1500'},
    {nm:'Pearl',html:'<div class="row gap-8" style="--csz:30px"><div class="cowrie up"></div><div class="cowrie up"></div><div class="cowrie down"></div></div>',price:'1200'},
  ];
  const TOK=[
    {nm:'Bindi',html:'<div class="tok tok--bindi" style="--tsz:56px;--tc:#C8442F"></div>',price:'OWNED',on:1},
    {nm:'Shell',html:'<div class="tok tok--shell" style="--tsz:56px;--tc:#C8442F"></div>',price:'700'},
    {nm:'Bead',html:'<div class="tok tok--bead" style="--tsz:56px;--tc:#C8442F"></div>',price:'700'},
    {nm:'Brass',html:'<div class="tok tok--brass" style="--tsz:56px;--tc:#C8442F"></div>',price:'1100'},
    {nm:'Tassel',html:'<div class="tok tok--tassel" style="--tsz:56px;--tc:#C8442F"></div>',price:'1100'},
  ];
  const DICE=[
    {nm:'Bone',html:'<div class="die" style="--dsz:72px"><i class="tl"></i><i class="tr"></i><i class="c"></i><i class="bl"></i><i class="br"></i></div>',price:'OWNED',on:1},
    {nm:'Indigo',html:'<div class="die die--indigo" style="--dsz:72px"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>',price:'900'},
    {nm:'Turmeric',html:'<div class="die die--turmeric" style="--dsz:72px"><i class="tl"></i><i class="c"></i><i class="br"></i></div>',price:'900'},
    {nm:'Leaf',html:'<div class="die die--leaf" style="--dsz:72px"><i class="tl"></i><i class="tr"></i><i class="ml"></i><i class="mr"></i><i class="bl"></i><i class="br"></i></div>',price:'1400'},
  ];
  const AVA=[
    {nm:'Peacock',html:'<div class="avatar" style="--sz:64px;--ring:#E8A526"><div class="ring"><div class="face">🦚</div></div></div>',price:'OWNED',on:1},
    {nm:'Panda',html:'<div class="avatar" style="--sz:64px;--ring:#5C8C4A"><div class="ring"><div class="face">🐼</div></div></div>',price:'500'},
    {nm:'Tiger',html:'<div class="avatar" style="--sz:64px;--ring:#C8442F"><div class="ring"><div class="face">🐯</div></div></div>',price:'500'},
    {nm:'Frog',html:'<div class="avatar" style="--sz:64px;--ring:#2E5375"><div class="ring"><div class="face">🐸</div></div></div>',price:'500'},
    {nm:'Elephant',html:'<div class="avatar" style="--sz:64px;--ring:#5b3a52"><div class="ring"><div class="face">🐘</div></div></div>',price:'900'},
    {nm:'Camel',html:'<div class="avatar" style="--sz:64px;--ring:#E8A526"><div class="ring"><div class="face">🐪</div></div></div>',price:'1600'},
  ];
  const BOARD=[
    {nm:'Chaupar',html:'<img src="board-1.svg" style="width:120px;border-radius:12px">',price:'OWNED',on:1},
    {nm:'Indigo',html:'<img src="board-2.svg" style="width:120px;border-radius:12px">',price:'2600'},
    {nm:'Calico',html:'<img src="board-3.svg" style="width:120px;border-radius:12px">',price:'2600'},
  ];
  const COLOR=[
    {nm:'Walnut',html:'<span style="font-family:Fraunces;font-weight:900;font-size:30px;color:#3A2418">Mayura</span>',price:'OWNED',on:1},
    {nm:'Madder',html:'<span style="font-family:Fraunces;font-weight:900;font-size:30px;color:#C8442F">Mayura</span>',price:'600'},
    {nm:'Indigo',html:'<span style="font-family:Fraunces;font-weight:900;font-size:30px;color:#2E5375">Mayura</span>',price:'600'},
    {nm:'Turmeric',html:'<span style="font-family:Fraunces;font-weight:900;font-size:30px;color:#c4860f">Mayura</span>',price:'600'},
  ];
  const SETS={cowrie:COWRIE,token:TOK,dice:DICE,avatar:AVA,board:BOARD,color:COLOR};
  const items=document.getElementById('items'), preview=document.getElementById('preview'), equip=document.getElementById('equip');
  function load(cat){
    const set=SETS[cat]; let sel=set.findIndex(x=>x.on); if(sel<0)sel=0;
    preview.innerHTML=`<div class="reveal-pop">${set[sel].html}</div>`;
    items.innerHTML=set.map((it,i)=>`<div class="item ${it.on?'on':''} reveal-pop" style="--d:${i*0.04}s" data-i="${i}">
      ${it.on?'<span class="tick">✓</span>':''}
      <div style="transform:scale(.6)">${it.html}</div>
      <div class="nm">${it.nm}</div>
      <div class="price">${it.price==='OWNED'?'EQUIPPED':'🪙 '+it.price}</div>
    </div>`).join('');
    items.querySelectorAll('.item').forEach(el=>el.onclick=()=>{
      const i=+el.dataset.i;
      preview.innerHTML=`<div class="reveal-pop">${set[i].html}</div>`;
      const owned=set[i].price==='OWNED';
      equip.textContent=owned?'Equipped ✓':'Unlock · 🪙 '+set[i].price;
      equip.className='btn lg block '+(owned?'btn-success':'btn-primary');
    });
    equip.textContent='Equipped ✓'; equip.className='btn btn-success lg block';
  }
  document.getElementById('catbar').addEventListener('click',e=>{
    const c=e.target.closest('.cat'); if(!c)return;
    document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on')); c.classList.add('on'); load(c.dataset.c);
  });
  load('cowrie');
</script>
</body>
</html>
