<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · No Internet</title>
<link rel="stylesheet" href="styles.css">
<style>
  .offzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
  .bigicon{width:120px;height:120px;display:grid;place-items:center;border-radius:var(--r-xl);background:var(--cloth-d);
    background-image:var(--weave);font-size:54px;position:relative;box-shadow:var(--e3);animation:sway 3s ease-in-out infinite}
  .bigicon::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(251,231,210,.45);border-radius:22px}
</style>
</head>
<body>
<div class="app">
  <div class="offzone">
    <div class="bigicon reveal-pop">📵</div>
    <h1 class="display reveal" style="font-size:42px;margin-top:22px">No <em>signal</em></h1>
    <p class="body light reveal" style="--d:.1s;max-width:290px;margin-top:8px">The thread's been cut. Check your connection — or play a Pass &amp; Play game with bots while you wait.</p>

    <div class="col gap-10" style="width:100%;max-width:300px;margin-top:24px">
      <button class="btn btn-primary lg block" id="retry">🔄 Try Again</button>
      <a class="bare" href="local-setup.html"><button class="btn btn-accent block">📿 Play Offline</button></a>
    </div>

    <div class="chip light" id="status" style="margin-top:18px"><span class="dot" style="background:var(--madder)"></span> Reconnecting…</div>
  </div>
</div>
<script>
  const btn=document.getElementById('retry');
  btn.addEventListener('click',()=>{
    btn.textContent='Checking…'; btn.disabled=true;
    setTimeout(()=>{btn.textContent='🔄 Try Again';btn.disabled=false;
      const s=document.getElementById('status'); s.style.animation='sway .4s ease'; setTimeout(()=>s.style.animation='',400);},1200);
  });
</script>
</body>
</html>
