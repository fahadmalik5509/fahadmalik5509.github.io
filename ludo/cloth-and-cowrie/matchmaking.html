<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Matchmaking</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mmwrap{flex:1;display:flex;flex-direction:column;padding:14px 18px 24px}
  .caster{text-align:center;margin-top:4px}
  .caster .throw{--csz:26px;justify-content:center}
  .dots span{animation:pulse 1.2s ease-in-out infinite;display:inline-block}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  .seats{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .seat .meta b{font-family:'Fraunces';font-weight:900;font-size:16px}
  .seat .search{font-weight:700;color:var(--ink-faint);font-size:13px}
  .seatdot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.2)}
  .timer{font-weight:800;font-size:14px;color:var(--turmeric)}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Casting lots</div>
  </div>

  <div class="mmwrap">
    <div class="caster">
      <div class="patch cloth tight" style="display:inline-block;padding:18px 22px">
        <div class="throw" id="throw">
          <div class="cowrie up"></div><div class="cowrie down"></div><div class="cowrie up"></div>
          <div class="cowrie down"></div><div class="cowrie up"></div><div class="cowrie down"></div>
        </div>
      </div>
      <h1 class="title on-cloth" style="font-size:26px;margin-top:16px">Finding players<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
      <div class="row center gap-10" style="margin-top:12px">
        <span class="chip light">🎲 Classic · 4P</span>
        <span class="chip light"><span class="dot"></span> Online</span>
      </div>
    </div>

    <div class="rowcard" style="margin-top:18px">
      <div class="meta"><span class="cap">Wager tier</span><b style="font-size:22px">1,800 🪙</b></div>
      <div class="row gap-8"><span class="cap">Elapsed</span><span class="timer" id="t">00:09</span></div>
    </div>

    <div class="seats" id="seats">
      <div class="rowcard seat">
        <div class="avatar s0" style="--sz:46px"><div class="ring"><div class="face">🦚</div></div></div>
        <div class="meta"><span class="cap">Seat 1 · You</span><b>Mayura</b></div>
        <span class="seatdot" style="background:var(--seat0)"></span>
      </div>
      <div class="rowcard seat empty"><div class="avatar" style="--sz:46px;--ring:var(--patch-2)"><div class="ring"><div class="face">⏳</div></div></div>
        <div class="meta"><span class="cap">Seat 2</span><div class="search">searching…</div></div><span class="seatdot" style="background:var(--patch-2)"></span></div>
      <div class="rowcard seat empty"><div class="avatar" style="--sz:46px;--ring:var(--patch-2)"><div class="ring"><div class="face">⏳</div></div></div>
        <div class="meta"><span class="cap">Seat 3</span><div class="search">searching…</div></div><span class="seatdot" style="background:var(--patch-2)"></span></div>
      <div class="rowcard seat empty"><div class="avatar" style="--sz:46px;--ring:var(--patch-2)"><div class="ring"><div class="face">⏳</div></div></div>
        <div class="meta"><span class="cap">Seat 4</span><div class="search">searching…</div></div><span class="seatdot" style="background:var(--patch-2)"></span></div>
    </div>

    <div class="mt-auto" style="padding-top:20px">
      <a class="bare" href="home.html"><button class="btn btn-ghost block">✕ Cancel Search</button></a>
    </div>
  </div>
</div>
<script>
  // shuffle the casting cowries
  const cows=[...document.querySelectorAll('#throw .cowrie')];
  setInterval(()=>cows.forEach(c=>{const up=Math.random()>.5;c.className='cowrie '+(up?'up lit':'down');}),700);
  let s=9; const t=document.getElementById('t');
  setInterval(()=>{s++;t.textContent='00:'+String(s).padStart(2,'0');},1000);
  const players=[['🐼','Mika','--seat1'],['🐯','Aarav','--seat2'],['🐸','Leo','--seat3']];
  let i=0;
  const fill=setInterval(()=>{
    const seat=document.querySelector('.seat.empty'); if(!seat){clearInterval(fill);ready();return;}
    const p=players[i++], color=getComputedStyle(document.documentElement).getPropertyValue(p[2]);
    seat.classList.remove('empty'); seat.style.animation='pop .5s cubic-bezier(.2,.8,.3,1.2) both';
    seat.innerHTML=`<div class="avatar" style="--sz:46px;--ring:${color}"><div class="ring"><div class="face">${p[0]}</div><div class="status"></div></div></div>
      <div class="meta"><span class="cap">Seat ${i+1} · Found</span><b>${p[1]}</b></div>
      <span class="seatdot" style="background:${color}"></span>`;
  },1300);
  function ready(){
    const w=document.createElement('div'); w.className='patch tight reveal';
    w.style.cssText='margin-top:14px;text-align:center;background:var(--leaf)';
    w.innerHTML='<div class="title on-cloth" style="font-size:22px">Match ready!</div>';
    document.getElementById('seats').after(w);
    setTimeout(()=>location.href='game.html',1100);
  }
</script>
</body>
</html>
