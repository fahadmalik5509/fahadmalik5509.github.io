<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660" font-family="Karla, sans-serif">
  <!-- CLOTH & COWRIE BOARD — geometry from board_layout_check.svg, redesigned.
       cell = 40px, x=30+col*40, y=30+row*40. 52-cell path (0-51),
       safe cowrie-stars at 8/21/34/47, colour starts at 0/13/26/39,
       home columns + four-triangle centre. Seat colours: red madder,
       blue indigo, yellow turmeric, green leaf. -->
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-opacity=".05" stroke-width="1.4"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#fff" stroke-opacity=".05" stroke-width="1.2"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2a1209" flood-opacity=".4"/>
    </filter>
    <g id="cowrie">
      <ellipse rx="11" ry="14" fill="#fbf3df" stroke="#b89a5a" stroke-width="1.5"/>
      <path d="M0,-9 Q3,0 0,9 Q-3,0 0,-9 Z" fill="none" stroke="#9a7b3a" stroke-width="1.4" stroke-dasharray="2 2"/>
    </g>
    <g id="star">
      <path d="M0,-11 L3.1,-3.4 11,-3.4 4.6,1.7 6.8,9.5 0,4.7 -6.8,9.5 -4.6,1.7 -11,-3.4 -3.1,-3.4 Z"
            fill="#E8A526" stroke="#a8761a" stroke-width="1.4"/>
    </g>
  </defs>

  <!-- ground -->
  <rect width="660" height="660" rx="26" fill="#7C2B3E"/>
  <rect width="660" height="660" rx="26" fill="url(#weave)"/>
  <rect x="6" y="6" width="648" height="648" rx="22" fill="none" stroke="#FBE7D2" stroke-opacity=".5" stroke-width="2.5" stroke-dasharray="7 6"/>

  <!-- cross arms (cream patch) -->
  <g stroke="#7C2B3E" stroke-width="2" stroke-dasharray="4 3" stroke-opacity=".4">
    <rect x="270" y="30" width="120" height="600" rx="12" fill="#FBE7D2"/>
    <rect x="30" y="270" width="600" height="120" rx="12" fill="#FBE7D2"/>
  </g>
  <rect x="270" y="30" width="120" height="600" rx="12" fill="url(#weave)"/>
  <rect x="30" y="270" width="600" height="120" rx="12" fill="url(#weave)"/>

  <!-- ===== YARDS (fabric patches + parked tokens) ===== -->
  <!-- top-left GREEN -->
  <g filter="url(#soft)">
    <rect x="30" y="30" width="240" height="240" rx="26" fill="#5C8C4A"/>
    <rect x="30" y="30" width="240" height="240" rx="26" fill="url(#weave)"/>
    <rect x="44" y="44" width="212" height="212" rx="18" fill="none" stroke="#FBE7D2" stroke-width="2.5" stroke-dasharray="7 6" stroke-opacity=".85"/>
    <rect x="75" y="75" width="150" height="150" rx="20" fill="#FBE7D2" stroke="#477036" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g stroke="#26421b" stroke-width="2">
    <circle cx="115" cy="115" r="18" fill="#5C8C4A"/><circle cx="111" cy="110" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="185" cy="115" r="18" fill="#5C8C4A"/><circle cx="181" cy="110" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="115" cy="185" r="18" fill="#5C8C4A"/><circle cx="111" cy="180" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="185" cy="185" r="18" fill="#5C8C4A"/><circle cx="181" cy="180" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
  </g>
  <!-- top-right RED -->
  <g filter="url(#soft)">
    <rect x="390" y="30" width="240" height="240" rx="26" fill="#C8442F"/>
    <rect x="390" y="30" width="240" height="240" rx="26" fill="url(#weave)"/>
    <rect x="404" y="44" width="212" height="212" rx="18" fill="none" stroke="#FBE7D2" stroke-width="2.5" stroke-dasharray="7 6" stroke-opacity=".85"/>
    <rect x="435" y="75" width="150" height="150" rx="20" fill="#FBE7D2" stroke="#a8351f" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g stroke="#7e2415" stroke-width="2">
    <circle cx="475" cy="115" r="18" fill="#C8442F"/><circle cx="471" cy="110" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="545" cy="115" r="18" fill="#C8442F"/><circle cx="541" cy="110" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="475" cy="185" r="18" fill="#C8442F"/><circle cx="471" cy="180" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="545" cy="185" r="18" fill="#C8442F"/><circle cx="541" cy="180" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
  </g>
  <!-- bottom-left YELLOW -->
  <g filter="url(#soft)">
    <rect x="30" y="390" width="240" height="240" rx="26" fill="#E8A526"/>
    <rect x="30" y="390" width="240" height="240" rx="26" fill="url(#weave)"/>
    <rect x="44" y="404" width="212" height="212" rx="18" fill="none" stroke="#7C2B3E" stroke-width="2.5" stroke-dasharray="7 6" stroke-opacity=".7"/>
    <rect x="75" y="435" width="150" height="150" rx="20" fill="#FBE7D2" stroke="#c4860f" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g stroke="#9a6c10" stroke-width="2">
    <circle cx="115" cy="475" r="18" fill="#E8A526"/><circle cx="111" cy="470" r="8" fill="#ffffff" fill-opacity=".45" stroke="none"/>
    <circle cx="185" cy="475" r="18" fill="#E8A526"/><circle cx="181" cy="470" r="8" fill="#ffffff" fill-opacity=".45" stroke="none"/>
    <circle cx="115" cy="545" r="18" fill="#E8A526"/><circle cx="111" cy="540" r="8" fill="#ffffff" fill-opacity=".45" stroke="none"/>
    <circle cx="185" cy="545" r="18" fill="#E8A526"/><circle cx="181" cy="540" r="8" fill="#ffffff" fill-opacity=".45" stroke="none"/>
  </g>
  <!-- bottom-right BLUE -->
  <g filter="url(#soft)">
    <rect x="390" y="390" width="240" height="240" rx="26" fill="#2E5375"/>
    <rect x="390" y="390" width="240" height="240" rx="26" fill="url(#weave)"/>
    <rect x="404" y="404" width="212" height="212" rx="18" fill="none" stroke="#FBE7D2" stroke-width="2.5" stroke-dasharray="7 6" stroke-opacity=".85"/>
    <rect x="435" y="435" width="150" height="150" rx="20" fill="#FBE7D2" stroke="#21405c" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g stroke="#19314a" stroke-width="2">
    <circle cx="475" cy="475" r="18" fill="#2E5375"/><circle cx="471" cy="470" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="545" cy="475" r="18" fill="#2E5375"/><circle cx="541" cy="470" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="475" cy="545" r="18" fill="#2E5375"/><circle cx="471" cy="540" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
    <circle cx="545" cy="545" r="18" fill="#2E5375"/><circle cx="541" cy="540" r="8" fill="#ffffff" fill-opacity=".4" stroke="none"/>
  </g>

  <!-- ===== HOME COLUMNS (towards centre) ===== -->
  <g stroke="#7C2B3E" stroke-width="1.6" stroke-dasharray="3.5 3" rx="6">
    <!-- green: cols1-5 row7 -->
    <rect x="70" y="310" width="40" height="40" rx="6" fill="#5C8C4A"/><rect x="110" y="310" width="40" height="40" rx="6" fill="#5C8C4A"/><rect x="150" y="310" width="40" height="40" rx="6" fill="#5C8C4A"/><rect x="190" y="310" width="40" height="40" rx="6" fill="#5C8C4A"/><rect x="230" y="310" width="40" height="40" rx="6" fill="#5C8C4A"/>
    <!-- red: col7 rows1-5 -->
    <rect x="310" y="70" width="40" height="40" rx="6" fill="#C8442F"/><rect x="310" y="110" width="40" height="40" rx="6" fill="#C8442F"/><rect x="310" y="150" width="40" height="40" rx="6" fill="#C8442F"/><rect x="310" y="190" width="40" height="40" rx="6" fill="#C8442F"/><rect x="310" y="230" width="40" height="40" rx="6" fill="#C8442F"/>
    <!-- blue: cols9-13 row7 -->
    <rect x="390" y="310" width="40" height="40" rx="6" fill="#2E5375"/><rect x="430" y="310" width="40" height="40" rx="6" fill="#2E5375"/><rect x="470" y="310" width="40" height="40" rx="6" fill="#2E5375"/><rect x="510" y="310" width="40" height="40" rx="6" fill="#2E5375"/><rect x="550" y="310" width="40" height="40" rx="6" fill="#2E5375"/>
    <!-- yellow: col7 rows9-13 -->
    <rect x="310" y="390" width="40" height="40" rx="6" fill="#E8A526"/><rect x="310" y="430" width="40" height="40" rx="6" fill="#E8A526"/><rect x="310" y="470" width="40" height="40" rx="6" fill="#E8A526"/><rect x="310" y="510" width="40" height="40" rx="6" fill="#E8A526"/><rect x="310" y="550" width="40" height="40" rx="6" fill="#E8A526"/>
  </g>

  <!-- ===== PATH — normal cells (cream) ===== -->
  <g fill="#FBE7D2" stroke="#7C2B3E" stroke-width="1.6" stroke-dasharray="3.5 3">
    <rect x="270" y="510" width="40" height="40" rx="6"/><rect x="270" y="470" width="40" height="40" rx="6"/><rect x="270" y="430" width="40" height="40" rx="6"/><rect x="270" y="390" width="40" height="40" rx="6"/>
    <rect x="230" y="350" width="40" height="40" rx="6"/><rect x="190" y="350" width="40" height="40" rx="6"/><rect x="150" y="350" width="40" height="40" rx="6"/><rect x="70" y="350" width="40" height="40" rx="6"/><rect x="30" y="350" width="40" height="40" rx="6"/>
    <rect x="30" y="270" width="40" height="40" rx="6"/>
    <rect x="110" y="270" width="40" height="40" rx="6"/><rect x="150" y="270" width="40" height="40" rx="6"/><rect x="190" y="270" width="40" height="40" rx="6"/><rect x="230" y="270" width="40" height="40" rx="6"/>
    <rect x="270" y="230" width="40" height="40" rx="6"/><rect x="270" y="190" width="40" height="40" rx="6"/><rect x="270" y="150" width="40" height="40" rx="6"/><rect x="270" y="70" width="40" height="40" rx="6"/><rect x="270" y="30" width="40" height="40" rx="6"/>
    <rect x="350" y="30" width="40" height="40" rx="6"/>
    <rect x="350" y="110" width="40" height="40" rx="6"/><rect x="350" y="150" width="40" height="40" rx="6"/><rect x="350" y="190" width="40" height="40" rx="6"/><rect x="350" y="230" width="40" height="40" rx="6"/>
    <rect x="390" y="270" width="40" height="40" rx="6"/><rect x="430" y="270" width="40" height="40" rx="6"/><rect x="470" y="270" width="40" height="40" rx="6"/><rect x="550" y="270" width="40" height="40" rx="6"/><rect x="590" y="270" width="40" height="40" rx="6"/>
    <rect x="590" y="350" width="40" height="40" rx="6"/>
    <rect x="510" y="350" width="40" height="40" rx="6"/><rect x="470" y="350" width="40" height="40" rx="6"/><rect x="430" y="350" width="40" height="40" rx="6"/><rect x="390" y="350" width="40" height="40" rx="6"/>
    <rect x="350" y="390" width="40" height="40" rx="6"/><rect x="350" y="430" width="40" height="40" rx="6"/><rect x="350" y="470" width="40" height="40" rx="6"/><rect x="350" y="550" width="40" height="40" rx="6"/><rect x="350" y="590" width="40" height="40" rx="6"/>
    <rect x="270" y="590" width="40" height="40" rx="6"/>
  </g>

  <!-- home-entry cells (seat-tinted, arrow toward centre) -->
  <g stroke="#7C2B3E" stroke-width="1.6" stroke-dasharray="3.5 3">
    <rect x="30" y="310" width="40" height="40" rx="6" fill="#5C8C4A" fill-opacity=".55"/>
    <rect x="310" y="30" width="40" height="40" rx="6" fill="#C8442F" fill-opacity=".55"/>
    <rect x="590" y="310" width="40" height="40" rx="6" fill="#2E5375" fill-opacity=".55"/>
    <rect x="310" y="590" width="40" height="40" rx="6" fill="#E8A526" fill-opacity=".55"/>
  </g>

  <!-- start cells (seat colour) -->
  <g stroke="#3A2418" stroke-width="1.8" stroke-dasharray="4 3">
    <rect x="270" y="550" width="40" height="40" rx="6" fill="#E8A526"/>
    <rect x="70" y="270" width="40" height="40" rx="6" fill="#5C8C4A"/>
    <rect x="350" y="70" width="40" height="40" rx="6" fill="#C8442F"/>
    <rect x="550" y="350" width="40" height="40" rx="6" fill="#2E5375"/>
  </g>
  <!-- start cowries -->
  <use href="#cowrie" x="290" y="570"/><use href="#cowrie" x="90" y="290"/>
  <use href="#cowrie" x="370" y="90"/><use href="#cowrie" x="570" y="370"/>

  <!-- safe squares (cream + cowrie-star) -->
  <g fill="#FFF3E4" stroke="#c4860f" stroke-width="1.8" stroke-dasharray="4 3">
    <rect x="110" y="350" width="40" height="40" rx="6"/><rect x="270" y="110" width="40" height="40" rx="6"/>
    <rect x="510" y="270" width="40" height="40" rx="6"/><rect x="350" y="510" width="40" height="40" rx="6"/>
  </g>
  <use href="#star" x="130" y="370"/><use href="#star" x="290" y="130"/>
  <use href="#star" x="530" y="290"/><use href="#star" x="370" y="530"/>

  <!-- ===== CENTRE — four triangles + medallion ===== -->
  <g stroke="#3A2418" stroke-width="2" stroke-linejoin="round">
    <path d="M270,270 L390,270 L330,330 Z" fill="#C8442F"/>   <!-- top red -->
    <path d="M270,270 L270,390 L330,330 Z" fill="#5C8C4A"/>   <!-- left green -->
    <path d="M390,270 L390,390 L330,330 Z" fill="#2E5375"/>   <!-- right blue -->
    <path d="M270,390 L390,390 L330,330 Z" fill="#E8A526"/>   <!-- bottom yellow -->
  </g>
  <circle cx="330" cy="330" r="30" fill="#7C2B3E" stroke="#FBE7D2" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="330" y="339" text-anchor="middle" font-size="26" fill="#FBE7D2">♛</text>
</svg>
