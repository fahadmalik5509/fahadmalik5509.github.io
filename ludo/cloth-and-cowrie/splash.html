<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Splash</title>
<link rel="stylesheet" href="styles.css">
<style>
  .splash{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .top{padding:26px 20px 0;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:2;padding:0 22px}
  /* a thrown arc of cowries */
  .arc{position:relative;width:240px;height:96px}
  .arc .cowrie{position:absolute;bottom:0;opacity:0;animation:tossin .55s cubic-bezier(.2,.8,.3,1.2) both}
  @keyframes tossin{0%{opacity:0;transform:translateY(40px) rotate(-40deg) scale(.6)}100%{opacity:1;transform:translateY(0) rotate(var(--rot,0deg)) scale(1)}}
  .word{text-align:center}
  .word .display{font-size:84px;line-height:.84}
  .embro{display:inline-block;opacity:0;animation:pop .5s cubic-bezier(.2,.8,.3,1.2) both}
  .countchip{margin-top:8px;opacity:0;animation:fadeup .5s ease forwards;animation-delay:1.1s}
  /* stitched loader seam */
  .seam{width:280px;height:14px;position:relative}
  .seam svg{width:100%;height:100%;overflow:visible}
  .seam path{fill:none;stroke:var(--turmeric);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:6 7;
    stroke-dashoffset:286;animation:sew 2.4s linear forwards}
  @keyframes sew{to{stroke-dashoffset:0}}
  .press{opacity:0;animation:fadeup .5s ease forwards 2.4s}
</style>
</head>
<body>
<div class="app">
  <a class="bare" href="login.html"><div class="splash" id="splash">
    <div class="top">
      <span class="kicker light">est. 590 AD</span>
      <span class="chip light">Pachisi · reborn</span>
    </div>

    <div class="core">
      <div class="arc" id="arc"></div>

      <div class="word">
        <div class="display"><span class="embro" id="e0" style="animation-delay:.5s">L</span><span class="embro" id="e1" style="animation-delay:.65s;color:var(--turmeric)">U</span><span class="embro" id="e2" style="animation-delay:.8s">D</span><span class="embro" id="e3" style="animation-delay:.95s;color:var(--turmeric)">O</span></div>
        <div class="countchip"><span class="chip light">Roll the cloth · count the shells</span></div>
      </div>
    </div>

    <div class="core" style="flex:none;padding-bottom:48px;gap:18px">
      <div class="seam">
        <svg viewBox="0 0 280 14"><path d="M2,7 H278"/></svg>
      </div>
      <div class="press"><span class="kicker">Tap to begin</span></div>
    </div>
  </div></a>
</div>
<script>
  // lay a thrown arc of 6 cowries; some up, some down
  const arc=document.getElementById('arc'); const N=6; const ups=[1,0,1,1,0,1];
  for(let i=0;i<N;i++){
    const t=i/(N-1); const x=t*200; const y=Math.sin(t*Math.PI)*78; const rot=(t-0.5)*60;
    const c=document.createElement('div');
    c.className='cowrie '+(ups[i]?'up':'down');
    c.style.cssText=`--csz:30px;--rot:${rot}deg;left:${x}px;bottom:${y}px;animation-delay:${0.1+i*0.1}s`;
    arc.appendChild(c);
    // light the mouth-up ones after they land
    if(ups[i]) setTimeout(()=>c.classList.add('lit'),700+i*100);
  }
</script>
</body>
</html>
