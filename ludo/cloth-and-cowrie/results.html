<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Results</title>
<link rel="stylesheet" href="styles.css">
<style>
  .results{flex:1;display:flex;flex-direction:column;padding:16px 16px 22px;position:relative;overflow:hidden}
  .conf{position:absolute;z-index:0;opacity:0;animation:confdrop .8s ease both}
  @keyframes confdrop{0%{opacity:0;transform:translateY(-40px) rotate(0)}100%{opacity:.9;transform:translateY(0) rotate(var(--r,20deg))}}
  .winhero{text-align:center;position:relative;z-index:2;margin-top:4px}
  .winhero .crownbig{font-size:46px;display:inline-block;animation:floaty 2.4s ease-in-out infinite}
  .podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:end;margin-top:16px;position:relative;z-index:2}
  .pod{display:flex;flex-direction:column;align-items:center;gap:8px}
  .pod .cushion{width:100%;border-radius:var(--r-md);display:grid;place-items:center;font-family:'Fraunces';font-weight:900;
    font-size:28px;color:var(--patch);position:relative;box-shadow:var(--e2);background-image:var(--weave)}
  .pod .cushion::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(251,231,210,.5);border-radius:10px}
  .pod.p1 .cushion{height:104px;background:var(--turmeric);color:var(--ink)}
  .pod.p1 .cushion::before{border-color:rgba(58,36,24,.3)}
  .pod.p2 .cushion{height:76px;background:var(--indigo)}
  .pod.p3 .cushion{height:56px;background:var(--leaf)}
  .pod .nm{font-family:'Fraunces';font-weight:700;font-size:13px;color:var(--patch)}
  .standings{margin-top:18px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
  .stand .rk{font-family:'Fraunces';font-weight:900;font-size:18px;width:26px;color:var(--ink-muted)}
  .stand .meta b{font-family:'Fraunces';font-weight:700;font-size:15px}
  .rw{font-weight:800}.rw.plus{color:var(--leaf)}.rw.minus{color:var(--madder)}
</style>
</head>
<body>
<div class="app">
  <div class="results">
    <div class="conf cowrie" style="--csz:22px;left:10%;top:8%;--r:18deg;animation-delay:.1s"></div>
    <div class="conf cowrie up" style="--csz:18px;right:14%;top:6%;--r:-20deg;animation-delay:.3s"></div>
    <div class="conf cowrie" style="--csz:20px;left:22%;top:20%;--r:30deg;animation-delay:.5s"></div>
    <div class="conf cowrie up" style="--csz:16px;right:24%;top:18%;--r:-12deg;animation-delay:.2s"></div>

    <div class="winhero">
      <div class="crownbig">👑</div>
      <h1 class="display reveal" style="font-size:44px;margin-top:4px">You <em>win!</em></h1>
      <div class="chip light" style="margin-top:10px">🪙 +1,800 · 🏆 +25 XP</div>
    </div>

    <div class="podium">
      <div class="pod p2 reveal-pop" style="--d:.15s">
        <div class="avatar s1" style="--sz:46px"><div class="ring"><div class="face">🐼</div></div></div>
        <div class="nm">Mika</div><div class="cushion">2</div>
      </div>
      <div class="pod p1 reveal-pop" style="--d:.05s">
        <div class="avatar s2" style="--sz:56px"><div class="ring"><div class="crown">👑</div><div class="face">🦚</div></div></div>
        <div class="nm">You</div><div class="cushion">1</div>
      </div>
      <div class="pod p3 reveal-pop" style="--d:.25s">
        <div class="avatar s0" style="--sz:42px"><div class="ring"><div class="face">🐯</div></div></div>
        <div class="nm">Aarav</div><div class="cushion">3</div>
      </div>
    </div>

    <div class="standings">
      <div class="rowcard stand reveal" style="--d:.1s"><span class="rk">1</span><div class="avatar s2" style="--sz:34px"><div class="ring"><div class="face">🦚</div></div></div><div class="meta"><b>You</b></div><span class="rw plus">+1,800</span></div>
      <div class="rowcard stand reveal" style="--d:.15s"><span class="rk">2</span><div class="avatar s1" style="--sz:34px"><div class="ring"><div class="face">🐼</div></div></div><div class="meta"><b>Mika</b></div><span class="rw minus">−600</span></div>
      <div class="rowcard stand reveal" style="--d:.2s"><span class="rk">3</span><div class="avatar s0" style="--sz:34px"><div class="ring"><div class="face">🐯</div></div></div><div class="meta"><b>Aarav</b></div><span class="rw minus">−600</span></div>
      <div class="rowcard stand reveal" style="--d:.25s"><span class="rk">4</span><div class="avatar s3" style="--sz:34px"><div class="ring"><div class="face">🐸</div></div></div><div class="meta"><b>Leo</b></div><span class="rw minus">−600</span></div>
    </div>

    <div class="mt-auto col gap-10" style="padding-top:18px;position:relative;z-index:2">
      <a class="bare" href="matchmaking.html"><button class="btn btn-primary lg block">🔄 Rematch</button></a>
      <a class="bare" href="home.html"><button class="btn btn-ghost block">🏡 Back Home</button></a>
    </div>
  </div>
</div>
</body>
</html>
