<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Pass & Play</title>
<link rel="stylesheet" href="styles.css">
<style>
  .setup{flex:1;display:flex;flex-direction:column;padding:14px 16px 22px;gap:16px}
  .players{display:flex;flex-direction:column;gap:10px}
  .prow .meta b{font-family:'Fraunces';font-weight:700;font-size:15px;display:block;line-height:1}
  .prow .meta span{font-size:11px;font-weight:700;color:var(--ink-muted)}
  .prow.off{opacity:.45}
  .seatchip{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-family:'Fraunces';font-weight:900}
  .typeseg{display:flex;background:var(--cloth-d);border-radius:var(--r-pill);padding:3px;gap:3px}
  .typeseg button{border:none;background:transparent;color:rgba(251,231,210,.7);font-weight:800;font-size:11px;
    padding:6px 10px;border-radius:var(--r-pill);cursor:pointer}
  .typeseg button.on{background:var(--turmeric);color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Pass &amp; Play</div>
  </div>

  <div class="setup">
    <div class="rowcard reveal">
      <div class="meta"><span class="cap">Players</span><b style="font-family:'Fraunces';font-size:18px">How many?</b></div>
      <div class="seg" style="width:170px" id="count"><button>2</button><button>3</button><button class="on">4</button></div>
    </div>

    <div>
      <span class="kicker light" style="margin-bottom:12px;display:inline-block">Seats</span>
      <div class="players" id="players"></div>
    </div>

    <div class="rowcard">
      <div class="meta"><span class="cap">Game mode</span><b style="font-family:'Fraunces';font-size:16px">🎲 Classic rules</b></div>
      <button class="btn btn-ghost sm">Change</button>
    </div>

    <a class="bare mt-auto" href="game.html"><button class="btn btn-success lg block">▶ Start Game</button></a>
  </div>
</div>
<script>
  const SEATS=[
    {c:'--seat0',face:'🦚',def:'You',human:true},
    {c:'--seat1',face:'🤖',def:'Bot Indigo',human:false},
    {c:'--seat2',face:'🤖',def:'Bot Turmeric',human:false},
    {c:'--seat3',face:'🤖',def:'Bot Leaf',human:false},
  ];
  let n=4;
  function render(){
    document.getElementById('players').innerHTML=SEATS.map((s,i)=>{
      const off=i>=n?' off':'';
      const color=getComputedStyle(document.documentElement).getPropertyValue(s.c);
      return `<div class="rowcard prow${off} reveal-pop" style="--d:${i*0.05}s">
        <div class="seatchip" style="background:${color}">${i+1}</div>
        <div class="avatar" style="--sz:40px;--ring:${color}"><div class="ring"><div class="face">${s.face}</div></div></div>
        <div class="meta"><b>${s.def}</b><span>${s.human?'Human · this device':'CPU opponent'}</span></div>
        ${i<n?(s.human?'<span class="badge gold">HOST</span>':`<div class="typeseg"><button class="on">BOT</button><button>HUMAN</button></div>`):'<span class="cap">empty</span>'}
      </div>`;
    }).join('');
  }
  document.getElementById('count').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); n=+b.textContent; render();
  });
  render();
</script>
</body>
</html>
