<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Settings</title>
<link rel="stylesheet" href="styles.css">
<style>
  .group{padding:14px 16px 2px}
  .glab{font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--turmeric);
    margin-bottom:10px;display:inline-block}
  .set .ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:50%;font-size:18px}
  .set .meta b{font-family:'Fraunces';font-weight:700;font-size:15px;display:block;line-height:1.1}
  .set .meta span{font-size:12px;font-weight:700;color:var(--ink-muted)}
  .val{font-weight:800;font-size:13px;color:var(--cloth)}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Settings</div>
  </div>

  <div class="scroll">
    <div class="group">
      <span class="glab">Sound &amp; Haptics</span>
      <div class="rowcard set reveal" style="--d:.05s"><div class="ic" style="background:var(--turmeric)">🔊</div><div class="meta"><b>Sound FX</b><span>Cowrie casts, captures, wins</span></div>
        <label class="toggle"><input type="checkbox" checked><span class="track"></span><span class="knob"></span></label></div>
      <div class="rowcard set reveal" style="--d:.08s;margin-top:10px"><div class="ic" style="background:var(--madder);color:#fff">🎵</div><div class="meta"><b>Music</b><span>Background loop</span></div>
        <label class="toggle"><input type="checkbox"><span class="track"></span><span class="knob"></span></label></div>
      <div class="rowcard set reveal" style="--d:.11s;margin-top:10px"><div class="ic" style="background:var(--indigo);color:#fff">📳</div><div class="meta"><b>Vibration</b><span>Haptic feedback</span></div>
        <label class="toggle"><input type="checkbox" checked><span class="track"></span><span class="knob"></span></label></div>
    </div>

    <div class="group">
      <span class="glab">Gameplay</span>
      <div class="rowcard set reveal" style="--d:.14s"><div class="ic" style="background:var(--leaf);color:#fff">⚡</div><div class="meta"><b>Quick Cast</b><span>Auto-throw on turn</span></div>
        <label class="toggle"><input type="checkbox"><span class="track"></span><span class="knob"></span></label></div>
      <div class="rowcard set reveal" style="--d:.17s;margin-top:10px"><div class="ic" style="background:var(--plum);color:#fff">🎞</div><div class="meta"><b>Animations</b><span>Token glide &amp; FX</span></div>
        <label class="toggle"><input type="checkbox" checked><span class="track"></span><span class="knob"></span></label></div>
    </div>

    <div class="group">
      <span class="glab">Account</span>
      <div class="rowcard set reveal" style="--d:.2s"><div class="ic" style="background:var(--patch-2)">🔗</div><div class="meta"><b>Linked Account</b><span>Google · mayura@…</span></div><span class="val">✓</span></div>
      <div class="rowcard set reveal" style="--d:.23s;margin-top:10px"><div class="ic" style="background:var(--patch-2)">🌐</div><div class="meta"><b>Language</b></div><span class="val">English ›</span></div>
      <div class="rowcard set reveal" style="--d:.26s;margin-top:10px"><div class="ic" style="background:var(--patch-2)">ℹ</div><div class="meta"><b>Version</b></div><span class="val">2.0.1</span></div>
    </div>

    <div class="pad">
      <a class="bare" href="login.html"><button class="btn btn-primary block">⏏ Sign Out</button></a>
    </div>
    <div style="height:10px"></div>
  </div>
</div>
</body>
</html>
