<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Join by Code</title>
<link rel="stylesheet" href="styles.css">
<style>
  .joinzone{flex:1;display:flex;flex-direction:column;padding:22px 18px 24px}
  .otp{display:flex;gap:10px;justify-content:center;margin-top:8px}
  .otp .cell{width:54px;height:68px;font-size:32px}
  .otp .cell.cur{box-shadow:5px 5px 0 var(--violet)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto}
  .keypad button{font-family:'Archivo Black';font-size:24px;border:var(--bd) solid var(--ink);background:var(--white);
    box-shadow:var(--sh-s);padding:16px 0;cursor:pointer;transition:transform .06s steps(2),box-shadow .06s steps(2)}
  .keypad button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .keypad button.fn{background:var(--yellow)}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Join by Code</div>
  </div>

  <div class="joinzone">
    <div style="text-align:center">
      <div class="ava float" style="--sz:72px;--ring:var(--violet);margin:0 auto"><div class="face">🔢</div></div>
      <h1 class="d2 stamp" style="margin-top:14px">ENTER<br>ROOM CODE</h1>
      <p class="body" style="margin-top:8px">Ask the host for their 5-character room code.</p>
    </div>

    <div class="otp" id="otp" style="margin-top:24px">
      <div class="cell cur"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="cap" id="msg" style="text-align:center;margin-top:14px;min-height:14px"></div>

    <div class="keypad" id="pad">
      <button>A</button><button>B</button><button>C</button>
      <button>D</button><button>E</button><button>F</button>
      <button>K</button><button>L</button><button>U</button>
      <button>7</button><button>0</button><button class="fn" data-k="del">⌫</button>
    </div>

    <a class="bare" href="game.html" id="link" style="pointer-events:none;opacity:.45;margin-top:14px"><button class="btn btn--violet lg block" id="go" disabled>Join Room</button></a>
  </div>
</div>
<script>
  const cells=[...document.querySelectorAll('#otp .cell')]; let val='';
  const msg=document.getElementById('msg');
  function paint(){
    cells.forEach((c,i)=>{c.textContent=val[i]||'';c.classList.toggle('on',!!val[i]);c.classList.toggle('cur',i===val.length)});
    const ok=val.length===5,l=document.getElementById('link'),b=document.getElementById('go');
    l.style.pointerEvents=ok?'auto':'none';l.style.opacity=ok?'1':'.45';b.disabled=!ok;
    msg.textContent=ok?'CODE LOOKS GOOD ✓':'';
  }
  document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.k==='del')val=val.slice(0,-1);else if(val.length<5)val+=b.textContent;paint();});
  paint();
</script>
</body>
</html>
