<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Private Room</title>
<link rel="stylesheet" href="styles.css">
<style>
  .pr-body{flex:1;display:flex;min-height:0}
  /* LEFT mode rail */
  .rail{width:96px;flex:none;border-right:var(--bd2) solid var(--ink);background:var(--paper-2);overflow-y:auto;padding:10px 8px 16px}
  .railitem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;cursor:pointer;text-align:center;
    margin-bottom:8px;border:var(--bd) solid var(--ink);background:var(--white);box-shadow:var(--sh-s);
    transition:transform .07s steps(2),box-shadow .07s steps(2)}
  .railitem:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .railitem .em{font-size:22px}
  .railitem .nm{font-family:'Archivo Black';font-size:10px;text-transform:uppercase;letter-spacing:.3px}
  .railitem.on{background:var(--violet)} .railitem.on .nm{color:#fff}
  .railitem.newm{background:var(--paper-2);border-style:dashed}
  /* RIGHT detail */
  .detail{flex:1;overflow-y:auto;padding:18px 16px 20px}
  .detail .em{font-size:46px;line-height:1}
  .detail .head{display:flex;align-items:center;gap:10px;margin-top:8px}
  .rules{margin-top:16px;display:flex;flex-direction:column;gap:0}
  .rule{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:2px solid var(--paper-2)}
  .rule:last-child{border-bottom:none}
  .rule .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border:var(--bd) solid var(--ink);font-size:15px;background:var(--white);box-shadow:var(--sh-s)}
  .rule span{font-weight:700;font-size:14px;line-height:1.35;padding-top:6px}
  .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  /* FOOTER */
  .pr-footer{border-top:var(--bd2) solid var(--ink);background:var(--paper);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .teamrow{display:flex;align-items:center;gap:12px;background:var(--white);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:11px 13px;margin-bottom:12px}
  .joinrow{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:11px;padding:13px;
    border:var(--bd) solid var(--ink);background:var(--white);box-shadow:var(--sh-s);font-family:'Archivo Black';
    text-transform:uppercase;font-size:14px;cursor:pointer;color:var(--ink)}
  .joinrow:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .keypad button{font-family:'Archivo Black';font-size:22px;border:var(--bd) solid var(--ink);background:var(--white);
    box-shadow:var(--sh-s);padding:14px 0;cursor:pointer}
  .keypad button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .keypad button.fn{background:var(--yellow)}
  .otp{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Private Room</div>
  </div>

  <div class="pr-body">
    <div class="rail" id="rail">
      <div class="railitem on" data-mode="classic"><span class="em">🎲</span><span class="nm">Classic</span></div>
      <div class="railitem" data-mode="blitz"><span class="em">⚡</span><span class="nm">Blitz</span></div>
      <div class="railitem" data-mode="rush"><span class="em">🐎</span><span class="nm">Rush</span></div>
      <div class="railitem newm" data-mode="new"><span class="em">＋</span><span class="nm">New</span></div>
    </div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="pr-footer">
    <div class="teamrow">
      <span style="font-size:22px">🤝</span>
      <div class="grow"><div class="h">TEAM MODE</div><div class="cap" style="margin-top:2px">2 v 2 · diagonal partners</div></div>
      <label class="toggle"><input type="checkbox" id="team"><span class="tk"></span><span class="kn"></span></label>
    </div>
    <a class="bare" href="game.html"><button class="btn btn--violet lg block">＋ Create Room</button></a>
    <button class="joinrow" id="openjoin">🔑 Have a code? · Join</button>
  </div>

  <!-- JOIN SHEET -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="d3" style="text-align:center">JOIN GAME</div>
    <p class="body" style="text-align:center;margin-top:6px">Enter the host's 5-character code.</p>
    <div class="otp" id="otp" style="margin-top:16px">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="keypad" id="pad">
      <button>A</button><button>B</button><button>C</button>
      <button>D</button><button>E</button><button>K</button>
      <button>L</button><button>U</button><button>7</button>
      <button class="fn" data-k="del">⌫</button><button>0</button><button class="fn" data-k="clr">CLR</button>
    </div>
    <a class="bare" href="game.html" id="joinlink" style="pointer-events:none;opacity:.45"><button class="btn btn--lime block" id="joinbtn" disabled>Enter code</button></a>
  </div>
</div>

<script>
  const MODES={
    classic:{em:'🎲',name:'Classic',badge:'',rules:[
      ['🏁','All 4 tokens home to win'],['🎲','Unlock a token on a 6'],['🎯','Land on a foe → send to yard'],
      ['🔁','Roll again on a 6'],['➕','+1 bonus roll per capture']]},
    blitz:{em:'⚡',name:'Blitz',badge:'',rules:[
      ['🏁','First 2 tokens home wins'],['🎲','Unlock on 1 or 6'],['🚪','1 token starts on the board'],
      ['🎯','Capture → yard'],['🔁','Roll again on a 6']]},
    rush:{em:'🐎',name:'Rush',badge:'CUSTOM',rules:[
      ['🏁','First token home wins'],['🎲','Unlock on 5 or 6'],['🚔','Capture → jail (escape on 6)'],
      ['🎰','Two dice every turn'],['🔥','Must capture when able']]},
  };
  const detail=document.getElementById('detail');
  function render(id){
    if(id==='new'){ detail.innerHTML='<div class="em">＋</div><div class="head"><div class="d3">NEW MODE</div></div>'+
      '<p class="body" style="margin-top:12px">Fork a built-in and tweak the rules — capture, unlock, dice, bonuses and win condition.</p>'+
      '<div class="acts"><button class="btn btn--yellow sm">🛠 Build Rules</button></div>'; return; }
    const m=MODES[id];
    const badge=m.badge?'<span class="badge badge--pink">CUSTOM</span>':'<span class="badge">BUILT-IN</span>';
    const acts=m.badge?'<button class="btn sm">⚙ Edit</button><button class="btn btn--pink sm">🗑 Delete</button>':'<button class="btn sm">👁 View rules</button>';
    detail.innerHTML='<div class="em stamp">'+m.em+'</div>'+
      '<div class="head"><div class="d3">'+m.name.toUpperCase()+'</div>'+badge+'</div>'+
      '<div class="rules">'+m.rules.map((r,i)=>'<div class="rule reveal" style="--d:'+(i*0.04)+'s"><span class="ic">'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'</div>'+
      '<div class="acts">'+acts+'</div>';
  }
  document.getElementById('rail').addEventListener('click',e=>{
    const it=e.target.closest('.railitem'); if(!it)return;
    document.querySelectorAll('.railitem').forEach(x=>x.classList.remove('on'));
    it.classList.add('on'); render(it.dataset.mode);
  });
  render('classic');

  const app=document.getElementById('app');
  document.getElementById('openjoin').onclick=()=>app.classList.add('open');
  document.getElementById('scrim').onclick=()=>app.classList.remove('open');
  const cells=[...document.querySelectorAll('#otp .cell')]; let val='';
  function paint(){cells.forEach((c,i)=>{c.textContent=val[i]||'';c.classList.toggle('on',!!val[i])});
    const ok=val.length===5,l=document.getElementById('joinlink'),b=document.getElementById('joinbtn');
    l.style.pointerEvents=ok?'auto':'none';l.style.opacity=ok?'1':'.45';b.disabled=!ok;b.textContent=ok?'Join Room':'Enter code';}
  document.getElementById('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k; if(k==='del')val=val.slice(0,-1);else if(k==='clr')val='';else if(val.length<5)val+=b.textContent;paint();});
  paint();
</script>
</body>
</html>
