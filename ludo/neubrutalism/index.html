<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Neubrutalism · Flow</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{display:block;background:var(--paper);
    background-image:linear-gradient(#F1E6C8 1.5px,transparent 1.5px),linear-gradient(90deg,#F1E6C8 1.5px,transparent 1.5px);background-size:28px 28px}
  .hub{max-width:1080px;margin:0 auto;padding:40px 22px 100px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-top:34px}
  .tile{display:block;text-decoration:none;color:var(--ink);background:var(--white);border:var(--bd2) solid var(--ink);
    box-shadow:var(--sh);transition:transform .08s steps(2),box-shadow .08s steps(2);position:relative;overflow:hidden}
  .tile:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--ink)}
  .tile .frame{aspect-ratio:1.5;display:grid;place-items:center;border-bottom:var(--bd) solid var(--ink);font-size:46px;position:relative}
  .tile .meta{padding:12px 14px}
  .tile .meta .n{font-family:'Space Mono';font-size:11px;font-weight:700;color:#9a8f74}
  .tile .meta .t{font-family:'Archivo Black';text-transform:uppercase;font-size:16px;margin-top:2px}
</style>
</head>
<body>
<div class="hub">
  <div class="head">
    <div>
      <span class="kicker">Design system · 01</span>
      <h1 class="d1 shadow-text" style="margin-top:14px">NEUBRUTALISM</h1>
      <p class="body" style="max-width:520px;margin-top:12px">A full Ludo flow built fresh in the neubrutalism language — thick ink, hard shadows, flat fills, slam-on-press. Every screen below is a real mock.</p>
    </div>
    <a class="top" href="components.html" style="font-family:'Space Mono';font-weight:700;text-decoration:none;color:var(--ink);border:var(--bd) solid var(--ink);background:var(--yellow);box-shadow:var(--sh-s);padding:10px 16px;display:inline-block">COMPONENTS →</a>
  </div>

  <div class="tiles" id="tiles"></div>
</div>
<script>
  const S=[
    ['splash','Splash','🎲','00'],['login','Login','🔑','01'],['home','Home','🏠','02'],
    ['matchmaking','Matchmaking','📡','03'],['team-lobby','Team Lobby','🤝','04'],['private-room','Private Room','🚪','05'],
    ['join','Join by Code','🔢','06'],['local-setup','Pass & Play','📱','07'],['game','Game Board','🎯','08'],
    ['results','Results','🏆','09'],['friends','Friends','👾','10'],['profile','Profile','🦊','11'],
    ['customize','Customize','🎨','12'],['settings','Settings','⚙','13'],['no-internet','No Internet','📵','14'],
  ];
  document.getElementById('tiles').innerHTML=S.map((s,i)=>
    `<a class="tile stamp" style="--d:${i*0.04}s" href="${s[0]}.html">
      <div class="frame">${s[2]}</div>
      <div class="meta"><div class="n">SCREEN ${s[3]}</div><div class="t">${s[1]}</div></div>
    </a>`).join('');
</script>
</body>
</html>
