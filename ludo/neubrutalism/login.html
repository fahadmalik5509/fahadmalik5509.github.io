<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Login</title>
<link rel="stylesheet" href="styles.css">
<style>
  .hero{position:relative;padding:30px 18px 26px;border-bottom:var(--bd2) solid var(--ink);background:var(--violet);overflow:hidden}
  .hero .blk{position:absolute;border:3px solid var(--ink)}
  .hero h1{color:var(--paper);text-shadow:5px 5px 0 var(--ink);position:relative;z-index:2}
  .hero .sub{color:#fff;font-weight:700;margin-top:10px;position:relative;z-index:2;max-width:300px}
  .formzone{flex:1;display:flex;flex-direction:column;padding:22px 18px 26px;gap:14px}
  .or{display:flex;align-items:center;gap:12px;font-family:'Space Mono';font-weight:700;font-size:11px;letter-spacing:2px;
    color:#9a8f74;text-transform:uppercase;margin:4px 0}
  .or::before,.or::after{content:"";flex:1;height:3px;background:var(--ink)}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:12px}
  .gbtn .g{width:26px;height:26px;background:#fff;border:var(--bd) solid var(--ink);display:grid;place-items:center;
    font-family:'Archivo Black';font-size:15px;color:var(--blue)}
  .legal{font-family:'Space Mono';font-size:11px;color:#9a8f74;text-align:center;line-height:1.6;margin-top:auto}
  .legal a{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <span class="blk float" style="right:-10px;top:14px;width:60px;height:60px;background:var(--yellow);transform:rotate(14deg)"></span>
    <span class="blk float" style="right:54px;bottom:-14px;width:36px;height:36px;background:var(--pink);animation-delay:.5s"></span>
    <span class="kicker stamp">Welcome back</span>
    <h1 class="d2 stamp" style="--d:.06s;margin-top:12px">READY TO<br>ROLL?</h1>
    <p class="sub reveal" style="--d:.2s">Jump in as a guest, or link Google to keep your coins and stats forever.</p>
  </div>

  <div class="formzone">
    <div class="reveal" style="--d:.1s">
      <label class="cap" style="display:block;margin-bottom:7px">Your name</label>
      <input class="input" placeholder="Pick a handle…" value="FoxTrot">
    </div>

    <a class="bare reveal" style="--d:.16s" href="home.html"><button class="btn btn--violet lg block">🎲 Play as Guest</button></a>

    <div class="or reveal" style="--d:.22s">or continue with</div>

    <a class="bare reveal" style="--d:.26s" href="home.html"><button class="btn block gbtn"><span class="g">G</span> Sign in with Google</button></a>
    <a class="bare reveal" style="--d:.3s" href="home.html"><button class="btn btn--ink block"> Sign in with Apple</button></a>

    <p class="legal reveal" style="--d:.36s">By playing you agree to our<br><a href="#">Terms</a> · <a href="#">Privacy Policy</a></p>
  </div>
</div>
</body>
</html>
