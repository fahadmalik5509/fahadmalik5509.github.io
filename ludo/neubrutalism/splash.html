<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Splash</title>
<link rel="stylesheet" href="styles.css">
<style>
  .splash{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
  /* drifting confetti blocks behind */
  .conf{position:absolute;border:3px solid var(--ink);z-index:0}
  .top{padding:26px 18px 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
  .core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;position:relative;z-index:2;padding:0 18px}
  /* dice ladder */
  .ladder{display:flex;gap:10px}
  .ladder .die{opacity:0;animation:popIn .4s cubic-bezier(.2,1.3,.4,1) both}
  .ladder .die.glow{box-shadow:6px 6px 0 var(--violet),0 0 0 var(--ink)}
  /* wordmark */
  .word{text-align:center}
  .word .l{display:inline-block;font-family:'Archivo Black';font-size:78px;line-height:.8;text-transform:uppercase;
    -webkit-text-stroke:0;text-shadow:6px 6px 0 var(--ink);opacity:0}
  .word .l:nth-child(1){color:var(--red)}.word .l:nth-child(2){color:var(--blue)}
  .word .l:nth-child(3){color:var(--yellow)}.word .l:nth-child(4){color:var(--green)}
  .tagchip{margin-top:14px;display:inline-block;background:var(--ink);color:var(--paper);font-family:'Space Mono';font-weight:700;
    letter-spacing:3px;font-size:12px;padding:6px 14px;text-transform:uppercase}
  /* loader */
  .loadwrap{width:100%;max-width:300px}
  .loadwrap .lab{display:flex;justify-content:space-between;font-family:'Space Mono';font-weight:700;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;color:#7a715b;margin-bottom:6px}
  .press{font-family:'Archivo Black';text-transform:uppercase;letter-spacing:2px;font-size:14px;color:var(--ink);
    background:var(--yellow);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:8px 16px;opacity:0}
</style>
</head>
<body>
<div class="app">
  <a class="bare" href="login.html"><div class="splash" id="splash">
    <!-- confetti -->
    <span class="conf float" style="left:8%;top:16%;width:34px;height:34px;background:var(--pink);transform:rotate(12deg)"></span>
    <span class="conf float" style="right:12%;top:12%;width:24px;height:24px;background:var(--lime);animation-delay:.6s"></span>
    <span class="conf float" style="left:14%;bottom:20%;width:28px;height:28px;background:var(--blue);animation-delay:1.1s;transform:rotate(-8deg)"></span>
    <span class="conf float" style="right:9%;bottom:24%;width:40px;height:40px;background:var(--yellow);animation-delay:.3s;transform:rotate(18deg)"></span>

    <div class="top">
      <span class="kicker">v 2.0</span>
      <span class="chip mono">EST. 590 AD</span>
    </div>

    <div class="core">
      <div class="ladder" id="ladder" style="--dsz:46px">
        <div class="die"><i class="c"></i></div>
        <div class="die"><i class="tl"></i><i class="br"></i></div>
        <div class="die"><i class="tl"></i><i class="c"></i><i class="br"></i></div>
        <div class="die die--yellow"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
        <div class="die die--violet"><i class="tl"></i><i class="tr"></i><i class="c"></i><i class="bl"></i><i class="br"></i></div>
        <div class="die die--mono"><i class="tl"></i><i class="tr"></i><i class="ml"></i><i class="mr"></i><i class="bl"></i><i class="br"></i></div>
      </div>

      <div class="word">
        <span class="l" id="l0">L</span><span class="l" id="l1">U</span><span class="l" id="l2">D</span><span class="l" id="l3">O</span>
        <div><span class="tagchip stamp" style="--d:1.1s">ROLL · RACE · WRECK</span></div>
      </div>
    </div>

    <div class="core" style="flex:none;padding-bottom:46px;gap:16px">
      <div class="loadwrap">
        <div class="lab"><span>Loading</span><span id="pct">0%</span></div>
        <div class="bar"><i id="fill" style="width:0%"></i></div>
      </div>
      <div class="press blink" id="press">TAP TO START</div>
    </div>
  </div></a>
</div>
<script>
  // light dice in sequence
  const dice=[...document.querySelectorAll('#ladder .die')];
  dice.forEach((d,i)=>{ d.style.animationDelay=(i*0.12)+'s'; setTimeout(()=>d.classList.add('glow'),300+i*180); });
  // stamp the letters
  ['l0','l1','l2','l3'].forEach((id,i)=>{
    const el=document.getElementById(id);
    setTimeout(()=>{el.style.animation='stampIn .45s cubic-bezier(.2,.8,.3,1) both';el.style.opacity=1;},500+i*150);
  });
  // loader
  let p=0; const fill=document.getElementById('fill'), pct=document.getElementById('pct'), press=document.getElementById('press');
  const iv=setInterval(()=>{ p=Math.min(100,p+Math.ceil(Math.random()*9));
    fill.style.width=p+'%'; pct.textContent=p+'%';
    if(p>=100){clearInterval(iv); press.style.opacity=1;} },130);
</script>
</body>
</html>
