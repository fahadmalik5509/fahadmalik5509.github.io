<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Results</title>
<link rel="stylesheet" href="styles.css">
<style>
  .results{flex:1;display:flex;flex-direction:column;padding:18px 16px 22px;position:relative;overflow:hidden}
  .conf{position:absolute;border:3px solid var(--ink);z-index:0;opacity:0;animation:hop .6s ease both}
  .winhero{text-align:center;position:relative;z-index:2;margin-top:6px}
  .winhero .crownbig{font-size:50px;display:inline-block;animation:hop 1.2s ease-in-out infinite}
  .podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:end;margin-top:18px;position:relative;z-index:2}
  .pod{display:flex;flex-direction:column;align-items:center;gap:8px}
  .pod .block{width:100%;border:var(--bd2) solid var(--ink);box-shadow:var(--sh-s);display:grid;place-items:center;
    font-family:'Archivo Black';font-size:30px;color:#fff;text-shadow:3px 3px 0 var(--ink)}
  .pod.p1 .block{height:108px;background:var(--yellow);color:var(--ink);text-shadow:none}
  .pod.p2 .block{height:78px;background:#cfc6b0}
  .pod.p3 .block{height:58px;background:var(--orange)}
  .pod .nm{font-family:'Archivo Black';font-size:13px;text-transform:uppercase}
  .standings{margin-top:18px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:2}
  .stand{display:flex;align-items:center;gap:12px;background:var(--white);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:10px}
  .stand .rk{font-family:'Archivo Black';font-size:18px;width:26px}
  .stand .nm{flex:1;font-family:'Archivo Black';text-transform:uppercase;font-size:14px}
  .stand .rw{font-family:'Space Mono';font-weight:700}
  .stand .rw.plus{color:var(--green)} .stand .rw.minus{color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="results">
    <span class="conf" style="left:10%;top:10%;width:30px;height:30px;background:var(--pink);animation-delay:.1s"></span>
    <span class="conf" style="right:12%;top:8%;width:24px;height:24px;background:var(--lime);animation-delay:.3s"></span>
    <span class="conf" style="left:20%;top:24%;width:20px;height:20px;background:var(--blue);animation-delay:.5s"></span>
    <span class="conf" style="right:22%;top:22%;width:28px;height:28px;background:var(--violet);animation-delay:.2s"></span>

    <div class="winhero">
      <div class="crownbig">👑</div>
      <h1 class="d2 stamp" style="margin-top:6px">YOU WIN!</h1>
      <div class="chip" style="margin-top:10px">🪙 +1,800 · 🏆 +25 XP</div>
    </div>

    <div class="podium">
      <div class="pod p2 pop" style="--d:.15s">
        <div class="ava" style="--sz:46px;--ring:var(--seat1)"><div class="face">🐼</div></div>
        <div class="nm">Mika</div>
        <div class="block">2</div>
      </div>
      <div class="pod p1 pop" style="--d:.05s">
        <div class="ava" style="--sz:56px;--ring:var(--seat2)"><div class="crown">👑</div><div class="face">🦊</div></div>
        <div class="nm">You</div>
        <div class="block">1</div>
      </div>
      <div class="pod p3 pop" style="--d:.25s">
        <div class="ava" style="--sz:42px;--ring:var(--seat0)"><div class="face">🐯</div></div>
        <div class="nm">Aarav</div>
        <div class="block">3</div>
      </div>
    </div>

    <div class="standings">
      <div class="stand reveal" style="--d:.1s"><span class="rk">1</span><div class="ava" style="--sz:34px;--ring:var(--seat2)"><div class="face">🦊</div></div><span class="nm">You</span><span class="rw plus">+1,800</span></div>
      <div class="stand reveal" style="--d:.15s"><span class="rk">2</span><div class="ava" style="--sz:34px;--ring:var(--seat1)"><div class="face">🐼</div></div><span class="nm">Mika</span><span class="rw minus">−600</span></div>
      <div class="stand reveal" style="--d:.2s"><span class="rk">3</span><div class="ava" style="--sz:34px;--ring:var(--seat0)"><div class="face">🐯</div></div><span class="nm">Aarav</span><span class="rw minus">−600</span></div>
      <div class="stand reveal" style="--d:.25s"><span class="rk">4</span><div class="ava" style="--sz:34px;--ring:var(--seat3)"><div class="face">🐸</div></div><span class="nm">Leo</span><span class="rw minus">−600</span></div>
    </div>

    <div class="mt-auto col gap-10" style="padding-top:18px;position:relative;z-index:2">
      <a class="bare" href="matchmaking.html"><button class="btn btn--violet lg block">🔄 Rematch</button></a>
      <a class="bare" href="home.html"><button class="btn block">🏠 Back Home</button></a>
    </div>
  </div>
</div>
</body>
</html>
