<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Settings</title>
<link rel="stylesheet" href="styles.css">
<style>
  .group{padding:14px 16px 2px}
  .glab{font-family:'Space Mono';font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    background:var(--ink);color:var(--paper);padding:4px 10px;display:inline-block;margin-bottom:10px}
  .set{display:flex;align-items:center;gap:12px;background:var(--white);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:12px;margin-bottom:10px}
  .set .ic{width:38px;height:38px;flex:none;display:grid;place-items:center;border:var(--bd) solid var(--ink);font-size:18px}
  .set .tx{flex:1}
  .set .tx b{font-family:'Archivo Black';font-size:14px;text-transform:uppercase;display:block;line-height:1}
  .set .tx span{font-size:12px;font-weight:700;color:#7a715b}
  .set .val{font-family:'Space Mono';font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Settings</div>
  </div>

  <div class="scroll">
    <div class="group">
      <span class="glab">Sound & Haptics</span>
      <div class="set pop" style="--d:.05s"><div class="ic" style="background:var(--yellow)">🔊</div><div class="tx"><b>Sound FX</b><span>Dice, captures, wins</span></div>
        <label class="toggle"><input type="checkbox" checked><span class="tk"></span><span class="kn"></span></label></div>
      <div class="set pop" style="--d:.08s"><div class="ic" style="background:var(--pink)">🎵</div><div class="tx"><b>Music</b><span>Background loop</span></div>
        <label class="toggle"><input type="checkbox"><span class="tk"></span><span class="kn"></span></label></div>
      <div class="set pop" style="--d:.11s"><div class="ic" style="background:var(--cyan)">📳</div><div class="tx"><b>Vibration</b><span>Haptic feedback</span></div>
        <label class="toggle"><input type="checkbox" checked><span class="tk"></span><span class="kn"></span></label></div>
    </div>

    <div class="group">
      <span class="glab">Gameplay</span>
      <div class="set pop" style="--d:.14s"><div class="ic" style="background:var(--lime)">⚡</div><div class="tx"><b>Quick Roll</b><span>Auto-roll on turn</span></div>
        <label class="toggle"><input type="checkbox"><span class="tk"></span><span class="kn"></span></label></div>
      <div class="set pop" style="--d:.17s"><div class="ic" style="background:var(--violet);color:#fff">🎞</div><div class="tx"><b>Animations</b><span>Token glide & FX</span></div>
        <label class="toggle"><input type="checkbox" checked><span class="tk"></span><span class="kn"></span></label></div>
    </div>

    <div class="group">
      <span class="glab">Account</span>
      <div class="set pop" style="--d:.2s"><div class="ic">🔗</div><div class="tx"><b>Linked Account</b><span>Google · foxtrot@…</span></div><span class="val">✓</span></div>
      <div class="set pop" style="--d:.23s"><div class="ic">🌐</div><div class="tx"><b>Language</b></div><span class="val">English ›</span></div>
      <div class="set pop" style="--d:.26s"><div class="ic">ℹ</div><div class="tx"><b>Version</b></div><span class="val">2.0.1</span></div>
    </div>

    <div class="pad">
      <a class="bare" href="login.html"><button class="btn btn--pink block">⏏ Sign Out</button></a>
    </div>
    <div style="height:10px"></div>
  </div>
</div>
</body>
</html>
