  </g>
  <use href="#b2star" x="130" y="370"/><use href="#b2star" x="290" y="130"/><use href="#b2star" x="530" y="290"/><use href="#b2star" x="370" y="530"/>

  <!-- centre -->
  <g stroke="#15110D" stroke-width="3" stroke-linejoin="round" fill="#FFFDF7">
    <path d="M270,270 L390,270 L330,330 Z"/><path d="M270,270 L270,390 L330,330 Z"/>
    <path d="M390,270 L390,390 L330,330 Z"/><path d="M270,390 L390,390 L330,330 Z"/>
  </g>
  <rect x="306" y="306" width="48" height="48" fill="#15110D"/>
  <use href="#b2star" x="330" y="330"/>
</svg>
