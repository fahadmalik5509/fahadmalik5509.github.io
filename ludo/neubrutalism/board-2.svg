<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660">
  <!-- NEUBRUTALISM BOARD 2 · "MONO" — black yards, white track, seat colour used
       only as a signal (home column / start / corner tab). High contrast. -->
  <defs>
    <g id="b2star"><path d="M0,-13 L3.6,-4 13,-4 5.4,2 8,11 0,5.4 -8,11 -5.4,2 -13,-4 -3.6,-4 Z" fill="#FFFDF7"/></g>
    <g id="b2stark"><path d="M0,-13 L3.6,-4 13,-4 5.4,2 8,11 0,5.4 -8,11 -5.4,2 -13,-4 -3.6,-4 Z" fill="#15110D"/></g>
  </defs>
  <rect x="34" y="34" width="608" height="608" fill="#15110D"/>
  <rect x="22" y="22" width="608" height="608" fill="#FFFDF7" stroke="#15110D" stroke-width="5"/>
  <rect x="270" y="30" width="120" height="600" fill="#FFFDF7" stroke="#15110D" stroke-width="3"/>
  <rect x="30" y="270" width="600" height="120" fill="#FFFDF7" stroke="#15110D" stroke-width="3"/>

  <!-- yards: black with white token outlines + seat colour corner tab -->
