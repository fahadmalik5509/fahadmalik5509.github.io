    <rect x="396" y="36" width="228" height="228" fill="#15110D"/>
    <rect x="36" y="396" width="228" height="228" fill="#15110D"/>
    <rect x="396" y="396" width="228" height="228" fill="#15110D"/>
  </g>
  <path d="M36,36 L116,36 L36,116 Z" fill="#34D17C"/>
  <path d="M624,36 L544,36 L624,116 Z" fill="#FF5747"/>
  <path d="M36,624 L116,624 L36,544 Z" fill="#FFD23F"/>
  <path d="M624,624 L544,624 L624,544 Z" fill="#3D7BFF"/>
  <g fill="none" stroke="#FFFDF7" stroke-width="3">
    <circle cx="115" cy="115" r="18"/><circle cx="185" cy="115" r="18"/><circle cx="115" cy="185" r="18"/><circle cx="185" cy="185" r="18"/>
    <circle cx="475" cy="115" r="18"/><circle cx="545" cy="115" r="18"/><circle cx="475" cy="185" r="18"/><circle cx="545" cy="185" r="18"/>
    <circle cx="115" cy="475" r="18"/><circle cx="185" cy="475" r="18"/><circle cx="115" cy="545" r="18"/><circle cx="185" cy="545" r="18"/>
    <circle cx="475" cy="475" r="18"/><circle cx="545" cy="475" r="18"/><circle cx="475" cy="545" r="18"/><circle cx="545" cy="545" r="18"/>
  </g>

