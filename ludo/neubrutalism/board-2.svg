    <rect x="70" y="310" width="40" height="40" fill="#34D17C"/><rect x="110" y="310" width="40" height="40" fill="#34D17C"/><rect x="150" y="310" width="40" height="40" fill="#34D17C"/><rect x="190" y="310" width="40" height="40" fill="#34D17C"/><rect x="230" y="310" width="40" height="40" fill="#34D17C"/>
    <rect x="310" y="70" width="40" height="40" fill="#FF5747"/><rect x="310" y="110" width="40" height="40" fill="#FF5747"/><rect x="310" y="150" width="40" height="40" fill="#FF5747"/><rect x="310" y="190" width="40" height="40" fill="#FF5747"/><rect x="310" y="230" width="40" height="40" fill="#FF5747"/>
    <rect x="390" y="310" width="40" height="40" fill="#3D7BFF"/><rect x="430" y="310" width="40" height="40" fill="#3D7BFF"/><rect x="470" y="310" width="40" height="40" fill="#3D7BFF"/><rect x="510" y="310" width="40" height="40" fill="#3D7BFF"/><rect x="550" y="310" width="40" height="40" fill="#3D7BFF"/>
    <rect x="310" y="390" width="40" height="40" fill="#FFD23F"/><rect x="310" y="430" width="40" height="40" fill="#FFD23F"/><rect x="310" y="470" width="40" height="40" fill="#FFD23F"/><rect x="310" y="510" width="40" height="40" fill="#FFD23F"/><rect x="310" y="550" width="40" height="40" fill="#FFD23F"/>
