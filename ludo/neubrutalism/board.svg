<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660" font-family="Archivo, sans-serif">
  <!-- NEUBRUTALISM BOARD — geometry from board_layout_check.svg. Thick ink borders,
       flat saturated fills, hard offset shadows, square cells. -->
  <defs>
    <filter id="hard" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#15131D" flood-opacity="1"/>
    </filter>
    <g id="star"><path d="M0,-12 L3.4,-3.7 12,-3.7 5,1.9 7.4,10.4 0,5.1 -7.4,10.4 -5,1.9 -12,-3.7 -3.4,-3.7 Z" fill="#15131D"/></g>
  </defs>

  <rect width="660" height="660" fill="#FFFFFF" stroke="#15131D" stroke-width="6"/>

  <!-- cross arms -->
  <rect x="270" y="30" width="120" height="600" fill="#FFF0C6" stroke="#15131D" stroke-width="3"/>
  <rect x="30" y="270" width="600" height="120" fill="#FFF0C6" stroke="#15131D" stroke-width="3"/>

  <!-- yards -->
  <g stroke="#15131D" stroke-width="4" filter="url(#hard)">
    <rect x="34" y="34" width="232" height="232" rx="4" fill="#49E06B"/>
    <rect x="394" y="34" width="232" height="232" rx="4" fill="#FF5C5C"/>
    <rect x="34" y="394" width="232" height="232" rx="4" fill="#FFD23F"/>
    <rect x="394" y="394" width="232" height="232" rx="4" fill="#4C8DFF"/>
  </g>
  <g stroke="#15131D" stroke-width="3">
    <rect x="78" y="78" width="144" height="144" rx="4" fill="#fff"/>
    <rect x="438" y="78" width="144" height="144" rx="4" fill="#fff"/>
    <rect x="78" y="438" width="144" height="144" rx="4" fill="#fff"/>
    <rect x="438" y="438" width="144" height="144" rx="4" fill="#fff"/>
  </g>
  <!-- parked tokens -->
  <g stroke="#15131D" stroke-width="3">
    <circle cx="115" cy="115" r="17" fill="#49E06B"/><circle cx="185" cy="115" r="17" fill="#49E06B"/><circle cx="115" cy="185" r="17" fill="#49E06B"/><circle cx="185" cy="185" r="17" fill="#49E06B"/>
    <circle cx="475" cy="115" r="17" fill="#FF5C5C"/><circle cx="545" cy="115" r="17" fill="#FF5C5C"/><circle cx="475" cy="185" r="17" fill="#FF5C5C"/><circle cx="545" cy="185" r="17" fill="#FF5C5C"/>
    <circle cx="115" cy="475" r="17" fill="#FFD23F"/><circle cx="185" cy="475" r="17" fill="#FFD23F"/><circle cx="115" cy="545" r="17" fill="#FFD23F"/><circle cx="185" cy="545" r="17" fill="#FFD23F"/>
    <circle cx="475" cy="475" r="17" fill="#4C8DFF"/><circle cx="545" cy="475" r="17" fill="#4C8DFF"/><circle cx="475" cy="545" r="17" fill="#4C8DFF"/><circle cx="545" cy="545" r="17" fill="#4C8DFF"/>
  </g>

  <!-- home columns -->
  <g stroke="#15131D" stroke-width="2.5">
    <rect x="70" y="310" width="40" height="40" fill="#49E06B"/><rect x="110" y="310" width="40" height="40" fill="#49E06B"/><rect x="150" y="310" width="40" height="40" fill="#49E06B"/><rect x="190" y="310" width="40" height="40" fill="#49E06B"/><rect x="230" y="310" width="40" height="40" fill="#49E06B"/>
    <rect x="310" y="70" width="40" height="40" fill="#FF5C5C"/><rect x="310" y="110" width="40" height="40" fill="#FF5C5C"/><rect x="310" y="150" width="40" height="40" fill="#FF5C5C"/><rect x="310" y="190" width="40" height="40" fill="#FF5C5C"/><rect x="310" y="230" width="40" height="40" fill="#FF5C5C"/>
    <rect x="390" y="310" width="40" height="40" fill="#4C8DFF"/><rect x="430" y="310" width="40" height="40" fill="#4C8DFF"/><rect x="470" y="310" width="40" height="40" fill="#4C8DFF"/><rect x="510" y="310" width="40" height="40" fill="#4C8DFF"/><rect x="550" y="310" width="40" height="40" fill="#4C8DFF"/>
    <rect x="310" y="390" width="40" height="40" fill="#FFD23F"/><rect x="310" y="430" width="40" height="40" fill="#FFD23F"/><rect x="310" y="470" width="40" height="40" fill="#FFD23F"/><rect x="310" y="510" width="40" height="40" fill="#FFD23F"/><rect x="310" y="550" width="40" height="40" fill="#FFD23F"/>
  </g>

  <!-- normal path cells -->
  <g fill="#FFFFFF" stroke="#15131D" stroke-width="2">
    <rect x="270" y="510" width="40" height="40"/><rect x="270" y="470" width="40" height="40"/><rect x="270" y="430" width="40" height="40"/><rect x="270" y="390" width="40" height="40"/>
    <rect x="230" y="350" width="40" height="40"/><rect x="190" y="350" width="40" height="40"/><rect x="150" y="350" width="40" height="40"/><rect x="70" y="350" width="40" height="40"/><rect x="30" y="350" width="40" height="40"/>
    <rect x="30" y="270" width="40" height="40"/><rect x="110" y="270" width="40" height="40"/><rect x="150" y="270" width="40" height="40"/><rect x="190" y="270" width="40" height="40"/><rect x="230" y="270" width="40" height="40"/>
    <rect x="270" y="230" width="40" height="40"/><rect x="270" y="190" width="40" height="40"/><rect x="270" y="150" width="40" height="40"/><rect x="270" y="70" width="40" height="40"/><rect x="270" y="30" width="40" height="40"/>
    <rect x="350" y="30" width="40" height="40"/><rect x="350" y="110" width="40" height="40"/><rect x="350" y="150" width="40" height="40"/><rect x="350" y="190" width="40" height="40"/><rect x="350" y="230" width="40" height="40"/>
    <rect x="390" y="270" width="40" height="40"/><rect x="430" y="270" width="40" height="40"/><rect x="470" y="270" width="40" height="40"/><rect x="550" y="270" width="40" height="40"/><rect x="590" y="270" width="40" height="40"/>
    <rect x="590" y="350" width="40" height="40"/><rect x="510" y="350" width="40" height="40"/><rect x="470" y="350" width="40" height="40"/><rect x="430" y="350" width="40" height="40"/><rect x="390" y="350" width="40" height="40"/>
    <rect x="350" y="390" width="40" height="40"/><rect x="350" y="430" width="40" height="40"/><rect x="350" y="470" width="40" height="40"/><rect x="350" y="550" width="40" height="40"/><rect x="350" y="590" width="40" height="40"/>
    <rect x="270" y="590" width="40" height="40"/>
  </g>
  <!-- home-entry tinted -->
  <g stroke="#15131D" stroke-width="2">
    <rect x="30" y="310" width="40" height="40" fill="#49E06B" fill-opacity=".5"/>
    <rect x="310" y="30" width="40" height="40" fill="#FF5C5C" fill-opacity=".5"/>
    <rect x="590" y="310" width="40" height="40" fill="#4C8DFF" fill-opacity=".5"/>
    <rect x="310" y="590" width="40" height="40" fill="#FFD23F" fill-opacity=".5"/>
  </g>
  <!-- start cells -->
  <g stroke="#15131D" stroke-width="3">
    <rect x="270" y="550" width="40" height="40" fill="#FFD23F"/><rect x="70" y="270" width="40" height="40" fill="#49E06B"/>
    <rect x="350" y="70" width="40" height="40" fill="#FF5C5C"/><rect x="550" y="350" width="40" height="40" fill="#4C8DFF"/>
  </g>
  <!-- safe cells -->
  <g fill="#FFF0C6" stroke="#15131D" stroke-width="3">
    <rect x="110" y="350" width="40" height="40"/><rect x="270" y="110" width="40" height="40"/><rect x="510" y="270" width="40" height="40"/><rect x="350" y="510" width="40" height="40"/>
  </g>
  <use href="#star" x="130" y="370"/><use href="#star" x="290" y="130"/><use href="#star" x="530" y="290"/><use href="#star" x="370" y="530"/>

  <!-- centre -->
  <g stroke="#15131D" stroke-width="3" stroke-linejoin="round">
    <path d="M270,270 L390,270 L330,330 Z" fill="#FF5C5C"/>
    <path d="M270,270 L270,390 L330,330 Z" fill="#49E06B"/>
    <path d="M390,270 L390,390 L330,330 Z" fill="#4C8DFF"/>
    <path d="M270,390 L390,390 L330,330 Z" fill="#FFD23F"/>
  </g>
  <circle cx="330" cy="330" r="30" fill="#15131D"/>
  <text x="330" y="340" text-anchor="middle" font-size="26" fill="#FFD23F">♛</text>
</svg>
