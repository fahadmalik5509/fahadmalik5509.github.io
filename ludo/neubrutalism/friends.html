<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Friends</title>
<link rel="stylesheet" href="styles.css">
<style>
  .tabs{display:flex;gap:0;padding:0 16px;margin-top:4px}
  .tabs button{flex:1;font-family:'Archivo Black';font-size:13px;text-transform:uppercase;border:var(--bd) solid var(--ink);
    background:var(--white);padding:10px;cursor:pointer;border-right:none;box-shadow:var(--sh-s)}
  .tabs button:last-child{border-right:var(--bd) solid var(--ink)}
  .tabs button.on{background:var(--ink);color:var(--paper)}
  .flist{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
  .frow{display:flex;align-items:center;gap:12px;background:var(--white);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:11px}
  .frow .nm{flex:1;min-width:0}
  .frow .nm b{font-family:'Archivo Black';font-size:15px;text-transform:uppercase;display:block;line-height:1}
  .frow .nm span{font-family:'Space Mono';font-size:11px;font-weight:700;color:#7a715b}
  .searchbar{padding:14px 16px 4px;position:relative}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Friends</div>
    <button class="ibtn" style="margin-left:auto">＋</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="on">Online · 3</button><button>All · 12</button><button>Requests · 2</button>
  </div>

  <div class="searchbar">
    <input class="input" placeholder="🔍 Search friends…">
  </div>

  <div class="scroll">
    <div class="flist" id="list">
      <div class="frow pop" style="--d:.05s">
        <div class="ava" style="--sz:48px;--ring:var(--lime)"><div class="face">🐼</div><div class="st"></div></div>
        <div class="nm"><b>Mika</b><span>🟢 In a match</span></div>
        <button class="btn btn--lime sm">Watch</button>
      </div>
      <div class="frow pop" style="--d:.1s">
        <div class="ava" style="--sz:48px;--ring:var(--pink)"><div class="face">🐯</div><div class="st"></div></div>
        <div class="nm"><b>Aarav</b><span>🟢 In lobby</span></div>
        <button class="btn btn--violet sm">Invite</button>
      </div>
      <div class="frow pop" style="--d:.15s">
        <div class="ava" style="--sz:48px;--ring:var(--yellow)"><div class="face">🐨</div><div class="st"></div></div>
        <div class="nm"><b>Zoya</b><span>🟢 Online</span></div>
        <button class="btn btn--violet sm">Invite</button>
      </div>
      <div class="frow pop" style="--d:.2s">
        <div class="ava" style="--sz:48px;--ring:#cfc6b0"><div class="face">🐸</div><div class="st off"></div></div>
        <div class="nm"><b>Leo</b><span>⚪ Last seen 2h ago</span></div>
        <button class="btn sm" disabled>Offline</button>
      </div>
      <div class="card flat" style="margin-top:6px;display:flex;align-items:center;gap:12px;background:var(--paper-2)">
        <span style="font-size:26px">🎁</span>
        <div class="grow"><div class="h">INVITE & EARN</div><div class="body" style="margin-top:2px">Get 500 🪙 per friend who joins.</div></div>
        <button class="btn btn--yellow sm">Share</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <a href="home.html"><span class="ic">🏠</span>Home</a>
    <a class="on" href="friends.html"><span class="ic">👾</span>Friends</a>
    <a href="customize.html"><span class="ic">🎨</span>Shop</a>
    <a href="profile.html"><span class="ic">🦊</span>You</a>
  </div>
</div>
<script>
  document.getElementById('tabs').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  });
</script>
</body>
</html>
