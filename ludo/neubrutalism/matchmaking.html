<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Matchmaking</title>
<link rel="stylesheet" href="styles.css">
<style>
  .mmwrap{flex:1;display:flex;flex-direction:column;padding:20px 18px 24px}
  .statusbox{text-align:center;margin-top:6px}
  .statusbox .em{font-size:54px;display:inline-block;animation:hop 1.1s ease-in-out infinite}
  .dots span{animation:blink 1.2s steps(1) infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  .tier{margin-top:18px}
  .seats{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .seat{display:flex;align-items:center;gap:14px;background:var(--white);border:var(--bd2) solid var(--ink);box-shadow:var(--sh-s);padding:12px}
  .seat.empty{background:var(--paper-2);border-style:dashed}
  .seat .lbl{font-family:'Space Mono';font-weight:700;font-size:11px;letter-spacing:2px;color:#9a8f74;text-transform:uppercase}
  .seat .nm{font-family:'Archivo Black';text-transform:uppercase;font-size:16px}
  .seat .search{font-family:'Space Mono';font-weight:700;color:#9a8f74;font-size:13px}
  .seat .seatdot{width:18px;height:18px;border:var(--bd) solid var(--ink);flex:none}
  .timer{font-family:'Space Mono';font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);padding:4px 10px}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Matchmaking</div>
  </div>

  <div class="mmwrap">
    <div class="statusbox">
      <div class="em">📡</div>
      <h1 class="d2 stamp" style="margin-top:10px">FINDING<br>PLAYERS<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
      <div class="row center gap-10" style="margin-top:14px">
        <span class="chip">🎲 Classic · 4P</span>
        <span class="chip"><span class="dotlive"></span> Online</span>
      </div>
    </div>

    <div class="tier card flat row between" style="margin-top:20px">
      <div><div class="cap">Wager tier</div><div class="d3" style="margin-top:2px">1,800 🪙</div></div>
      <div class="row gap-10"><span class="cap">Elapsed</span><span class="timer" id="t">00:09</span></div>
    </div>

    <div class="seats" id="seats">
      <div class="seat" style="border-color:var(--ink)">
        <div class="ava" style="--sz:46px;--ring:var(--seat0)"><div class="face">🦊</div></div>
        <div class="grow"><div class="lbl">Seat 1 · You</div><div class="nm">FoxTrot</div></div>
        <span class="seatdot" style="background:var(--seat0)"></span>
      </div>
      <div class="seat empty" data-seat="1"><div class="ava" style="--sz:46px;background:var(--paper-2)"><div class="face">⏳</div></div>
        <div class="grow"><div class="lbl">Seat 2</div><div class="search">searching…</div></div><span class="seatdot" style="background:var(--paper-2)"></span></div>
      <div class="seat empty" data-seat="2"><div class="ava" style="--sz:46px;background:var(--paper-2)"><div class="face">⏳</div></div>
        <div class="grow"><div class="lbl">Seat 3</div><div class="search">searching…</div></div><span class="seatdot" style="background:var(--paper-2)"></span></div>
      <div class="seat empty" data-seat="3"><div class="ava" style="--sz:46px;background:var(--paper-2)"><div class="face">⏳</div></div>
        <div class="grow"><div class="lbl">Seat 4</div><div class="search">searching…</div></div><span class="seatdot" style="background:var(--paper-2)"></span></div>
    </div>

    <div class="mt-auto" style="padding-top:20px">
      <a class="bare" href="home.html"><button class="btn btn--pink block">✕ Cancel Search</button></a>
    </div>
  </div>
</div>
<script>
  // tick timer
  let s=9; const t=document.getElementById('t');
  setInterval(()=>{s++;t.textContent='00:'+String(s).padStart(2,'0');},1000);
  // fill seats one by one
  const players=[['🐼','Mika',getC('--seat1')],['🐯','Aarav',getC('--seat2')],['🐸','Leo',getC('--seat3')]];
  function getC(v){return getComputedStyle(document.documentElement).getPropertyValue(v);}
  let i=0;
  const fill=setInterval(()=>{
    const seat=document.querySelector('.seat.empty'); if(!seat){clearInterval(fill);goGame();return;}
    const p=players[i++];
    seat.classList.remove('empty'); seat.style.borderStyle='solid';
    seat.style.animation='popIn .4s cubic-bezier(.2,1.3,.4,1) both';
    seat.innerHTML=`<div class="ava" style="--sz:46px;--ring:${p[2]}"><div class="face">${p[0]}</div><div class="st"></div></div>
      <div class="grow"><div class="lbl">Seat ${i+1} · Found</div><div class="nm">${p[1]}</div></div>
      <span class="seatdot" style="background:${p[2]}"></span>`;
  },1300);
  function goGame(){
    const w=document.createElement('div'); w.className='card'; w.style.cssText='margin-top:14px;text-align:center;background:var(--lime)';
    w.innerHTML='<div class="d3">MATCH READY!</div>';
    document.getElementById('seats').after(w);
    setTimeout(()=>location.href='game.html',1100);
  }
</script>
</body>
</html>
