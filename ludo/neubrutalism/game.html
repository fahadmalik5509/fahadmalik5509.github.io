<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Game</title>
<link rel="stylesheet" href="styles.css">
<style>
  .gamebar{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
  .gamebar .pot{flex:1;text-align:center}
  .gamebar .pot b{font-family:'Archivo Black';font-size:18px}
  .gamebar .pot small{display:block;font-family:'Space Mono';font-size:10px;letter-spacing:2px;color:#7a715b;text-transform:uppercase;font-weight:700}
  .ppr{display:flex;gap:8px;padding:4px 14px}
  .pp{flex:1;display:flex;align-items:center;gap:8px;background:var(--white);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:7px 9px;transition:.15s}
  .pp.active{background:var(--yellow);box-shadow:5px 5px 0 var(--violet)}
  .pp .nm{flex:1;min-width:0}
  .pp .nm b{font-family:'Archivo Black';font-size:12px;text-transform:uppercase;display:block;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pp .home{display:flex;gap:3px;margin-top:5px}
  .pp .home i{width:8px;height:8px;border:1.5px solid var(--ink);background:var(--white)}
  .pp .home i.in{background:var(--c)}
  .pp .clk{font-family:'Space Mono';font-weight:700;font-size:11px}
  .boardstage{padding:10px 14px;display:flex;justify-content:center}
  .board{position:relative;width:100%;max-width:360px;aspect-ratio:1}
  .board>img{width:100%;display:block}
  .tk{position:absolute;width:7.5%;height:7.5%;transform:translate(-50%,-50%);border:var(--bd) solid var(--ink);
    box-shadow:2px 2px 0 var(--ink);transition:left .5s cubic-bezier(.3,.8,.3,1.1),top .5s cubic-bezier(.3,.8,.3,1.1);z-index:5}
  .tk.gone{animation:hop .5s ease forwards;opacity:0}
  .tk.me{cursor:pointer;animation:floatY 1s ease-in-out infinite;box-shadow:0 0 0 4px var(--violet),2px 2px 0 var(--ink)}
  .switcher{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:8}
  .switcher button{width:32px;height:32px;border:var(--bd) solid var(--ink);background:var(--white);box-shadow:var(--sh-s);
    font-family:'Archivo Black';font-size:12px;cursor:pointer}
  .switcher button.on{background:var(--violet);color:#fff}
  .footzone{margin-top:auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
  .turnbar{position:relative;display:flex;align-items:center;gap:12px;background:var(--violet);border:var(--bd2) solid var(--ink);box-shadow:var(--sh);padding:12px}
  .turnbar .you{display:flex;align-items:center;gap:9px;flex:1}
  .turnbar .you .nm b{font-family:'Archivo Black';font-size:15px;color:#fff;display:block;text-transform:uppercase}
  .turnbar .you .nm span{font-family:'Space Mono';font-size:11px;color:#fff;font-weight:700}
  .dice-btn{width:64px;height:64px;border:none;background:none;padding:0;cursor:pointer;flex:none}
  .dice-btn .die{width:64px;height:64px}
  .dice-btn:active .die{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .hint{position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;font-family:'Space Mono';font-weight:700;
    font-size:11px;letter-spacing:1px;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 12px}
  .emote{position:absolute;right:14px;top:60px;display:flex;flex-direction:column;gap:8px;z-index:8}
</style>
</head>
<body>
<div class="app">
  <div class="gamebar">
    <a class="bare" href="results.html"><button class="ibtn">⏏</button></a>
    <div class="pot"><b>🪙 1,800</b><small>prize pot · round 1</small></div>
    <button class="ibtn">🔊</button>
  </div>

  <div class="ppr">
    <div class="pp" style="--c:var(--seat1)">
      <div class="ava" style="--sz:34px;--ring:var(--seat1)"><div class="face">🐼</div></div>
      <div class="nm"><b>Mika</b><div class="home"><i class="in"></i><i></i><i></i><i></i></div></div>
    </div>
    <div class="pp" style="--c:var(--seat0)">
      <div class="ava" style="--sz:34px;--ring:var(--seat0)"><div class="face">🐯</div></div>
      <div class="nm"><b>Aarav</b><div class="home"><i class="in"></i><i class="in"></i><i></i><i></i></div></div>
    </div>
  </div>

  <div class="boardstage">
    <div class="board" id="board">
      <div class="switcher" id="switcher">
        <button class="on" data-b="1">1</button><button data-b="2">2</button><button data-b="3">3</button>
      </div>
      <img src="board-1.svg" alt="Ludo board" id="boardimg">
      <span class="tk tok--disc" style="left:13.64%;top:43.94%;background:var(--seat3)"></span>
      <span class="tk tok--disc" id="redtok" style="left:56.06%;top:13.64%;background:var(--seat0)"></span>
      <span class="tk tok--disc" style="left:86.36%;top:56.06%;background:var(--seat1)"></span>
      <span class="tk tok--disc me" id="metok" style="left:56.06%;top:80.3%;background:var(--seat2)"></span>
    </div>
  </div>

  <div class="emote">
    <button class="ibtn">😄</button>
    <button class="ibtn">💬</button>
  </div>

  <div class="footzone">
    <div class="ppr" style="padding:0 0 8px">
      <div class="pp active" style="--c:var(--seat2)">
        <div class="ava" style="--sz:34px;--ring:var(--seat2)"><div class="face">🦊</div></div>
        <div class="nm"><b>You · Yellow</b><div class="home"><i></i><i></i><i></i><i></i></div></div>
        <span class="clk">0:15</span>
      </div>
    </div>
    <div class="turnbar">
      <span class="hint" id="hint">Your turn — tap to roll</span>
      <div class="you">
        <div class="ava" style="--sz:44px;--ring:var(--seat2)"><div class="face">🦊</div><div class="st"></div></div>
        <div class="nm"><b>You</b><span>0 home · 4 in yard</span></div>
      </div>
      <button class="dice-btn" id="dice" aria-label="Roll dice">
        <div class="die die--yellow" id="dieface"><i class="tl"></i><i class="br"></i></div>
      </button>
    </div>
  </div>
</div>
<script>
  const faces={1:['c'],2:['tl','br'],3:['tl','c','br'],4:['tl','tr','bl','br'],5:['tl','tr','c','bl','br'],6:['tl','tr','ml','mr','bl','br']};
  const die=document.getElementById('dieface'), btn=document.getElementById('dice'),
        hint=document.getElementById('hint'), me=document.getElementById('metok'), red=document.getElementById('redtok');
  let rolling=false, rolled=false;
  const render=n=>die.innerHTML=faces[n].map(p=>`<i class="${p}"></i>`).join('');
  btn.addEventListener('click',()=>{
    if(rolling||rolled)return; rolling=true; hint.textContent='rolling…'; die.classList.add('rolling');
    let s=0; const iv=setInterval(()=>{render(1+Math.floor(Math.random()*6)); if(++s>9){clearInterval(iv);
      const n=1+Math.floor(Math.random()*6); render(n); die.classList.remove('rolling');
      hint.textContent='rolled '+n+' — tap your token'; rolling=false; rolled=true;}},65);
  });
  me.addEventListener('click',()=>{
    if(!rolled)return; rolled=false; me.style.animation='none'; hint.textContent='moving…';
    me.style.left='56.06%'; me.style.top='13.64%';
    setTimeout(()=>{ red.classList.add('gone'); hint.textContent='CAPTURED! → yard';
      setTimeout(()=>hint.textContent="opponent's turn",900); },550);
  });
  render(2);
  // board switcher
  document.getElementById('switcher').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    document.querySelectorAll('.switcher button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const img=document.getElementById('boardimg'); img.style.opacity=0;
    setTimeout(()=>{img.src='board-'+b.dataset.b+'.svg';img.style.transition='opacity .2s';img.style.opacity=1;},120);
  });
</script>
</body>
</html>
