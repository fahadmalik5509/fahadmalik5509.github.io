<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Team Lobby</title>
<link rel="stylesheet" href="styles.css">
<style>
  .teamzone{flex:1;display:flex;flex-direction:column;padding:16px 16px 22px;gap:14px}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
  .teamcol{border:var(--bd2) solid var(--ink);box-shadow:var(--sh-s);padding:14px;display:flex;flex-direction:column;gap:12px}
  .teamcol.a{background:var(--seat0)} .teamcol.b{background:var(--seat1)}
  .teamcol .cap{color:#fff}
  .teamcol h3{font-family:'Archivo Black';color:#fff;text-shadow:3px 3px 0 var(--ink);font-size:20px;text-transform:uppercase}
  .pslot{display:flex;align-items:center;gap:10px;background:var(--white);border:var(--bd) solid var(--ink);padding:8px}
  .pslot.empty{background:rgba(255,255,255,.4);border-style:dashed}
  .pslot .nm b{font-family:'Archivo Black';font-size:14px;text-transform:uppercase;display:block;line-height:1}
  .pslot .nm span{font-size:11px;font-weight:700;color:#7a715b}
  .vsbadge{align-self:center;font-family:'Archivo Black';font-size:24px;background:var(--yellow);border:var(--bd2) solid var(--ink);
    box-shadow:var(--sh-s);padding:10px 6px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .invite{display:flex;align-items:center;gap:12px;background:var(--white);border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);padding:12px}
  .codebox{font-family:'Space Mono';font-weight:700;font-size:20px;letter-spacing:4px;background:var(--ink);color:var(--paper);padding:8px 14px}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Team Up · 2v2</div>
  </div>

  <div class="teamzone">
    <div class="invite stamp">
      <span style="font-size:24px">🔗</span>
      <div class="grow"><div class="cap">Invite code</div><div class="codebox" style="display:inline-block;margin-top:4px">K7-LU2</div></div>
      <button class="ibtn">📋</button>
    </div>

    <div class="vs">
      <div class="teamcol a pop" style="--d:.05s">
        <div class="cap">Team A · {0,2}</div>
        <div class="pslot">
          <div class="ava" style="--sz:42px;--ring:var(--seat0)"><div class="face">🦊</div></div>
          <div class="nm"><b>You</b><span>Captain</span></div>
        </div>
        <div class="pslot">
          <div class="ava" style="--sz:42px;--ring:var(--seat2)"><div class="face">🐯</div></div>
          <div class="nm"><b>Aarav</b><span>Ready</span></div>
        </div>
      </div>

      <div class="vsbadge">VS</div>

      <div class="teamcol b pop" style="--d:.12s">
        <div class="cap">Team B · {1,3}</div>
        <div class="pslot">
          <div class="ava" style="--sz:42px;--ring:var(--seat1)"><div class="face">🐼</div></div>
          <div class="nm"><b>Mika</b><span>Ready</span></div>
        </div>
        <div class="pslot empty">
          <div class="ava" style="--sz:42px;background:#ffffff66"><div class="face">＋</div></div>
          <div class="nm"><b style="color:#fff">Open seat</b><span style="color:#fff8">waiting…</span></div>
        </div>
      </div>
    </div>

    <div class="card flat row between">
      <div><div class="cap">Wager</div><div class="d3 mono">1,800</div></div>
      <div class="seg" style="width:170px"><button>Casual</button><button class="on">Ranked</button></div>
    </div>

    <div class="mt-auto col gap-10">
      <button class="btn btn--lime lg block" disabled>Waiting for 1 player…</button>
      <a class="bare" href="home.html"><button class="btn btn--pink block">Leave Party</button></a>
    </div>
  </div>
</div>
</body>
</html>
