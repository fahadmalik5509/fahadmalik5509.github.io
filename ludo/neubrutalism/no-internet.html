<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · No Internet</title>
<link rel="stylesheet" href="styles.css">
<style>
  .offzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px}
  .bigicon{position:relative;width:120px;height:120px;display:grid;place-items:center;background:var(--white);
    border:var(--bd3) solid var(--ink);box-shadow:var(--sh-l);font-size:58px;animation:shake 2s steps(2) infinite}
  .bigicon .slash{position:absolute;inset:0;display:grid;place-items:center;font-size:90px;color:var(--red)}
  .retrybar{margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="offzone">
    <div class="bigicon stamp"><span>📡</span></div>
    <h1 class="d2 shadow-text" style="margin-top:22px">NO<br>SIGNAL</h1>
    <p class="body" style="max-width:280px;margin-top:8px">You're offline. Check your connection — or jump into a Pass & Play game with bots while you wait.</p>

    <div class="col gap-10" style="width:100%;max-width:300px;margin-top:22px">
      <button class="btn btn--violet lg block" id="retry">🔄 Try Again</button>
      <a class="bare" href="local-setup.html"><button class="btn btn--yellow block">📱 Play Offline</button></a>
    </div>

    <div class="chip" id="status" style="margin-top:18px"><span class="dotlive" style="background:var(--red)"></span> Reconnecting…</div>
  </div>
</div>
<script>
  const btn=document.getElementById('retry');
  btn.addEventListener('click',()=>{
    btn.textContent='Checking…'; btn.disabled=true;
    setTimeout(()=>{btn.textContent='🔄 Try Again';btn.disabled=false;
      const s=document.getElementById('status'); s.style.animation='shake .4s steps(2)';
      setTimeout(()=>s.style.animation='',400);},1200);
  });
</script>
</body>
</html>
