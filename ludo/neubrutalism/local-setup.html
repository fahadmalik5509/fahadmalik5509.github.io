<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Pass & Play</title>
<link rel="stylesheet" href="styles.css">
<style>
  .setup{flex:1;display:flex;flex-direction:column;padding:16px 16px 22px;gap:16px}
  .pcount{display:flex;flex-direction:column;gap:10px}
  .players{display:flex;flex-direction:column;gap:10px}
  .prow{display:flex;align-items:center;gap:12px;border:var(--bd2) solid var(--ink);box-shadow:var(--sh-s);padding:11px;background:var(--white)}
  .prow .seatchip{width:40px;height:40px;flex:none;display:grid;place-items:center;border:var(--bd) solid var(--ink);
    font-family:'Archivo Black';color:#fff;font-size:16px}
  .prow .nm{flex:1}
  .prow .nm b{font-family:'Archivo Black';text-transform:uppercase;font-size:15px;display:block;line-height:1}
  .prow .nm span{font-size:11px;font-weight:700;color:#7a715b}
  .prow.off{opacity:.5}
  .typeseg{display:flex;border:var(--bd) solid var(--ink);box-shadow:var(--sh-s)}
  .typeseg button{border:none;background:var(--white);font-family:'Archivo Black';font-size:11px;text-transform:uppercase;
    padding:7px 11px;cursor:pointer;border-left:var(--bd) solid var(--ink)}
  .typeseg button:first-child{border-left:none}
  .typeseg button.on{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Pass & Play</div>
  </div>

  <div class="setup">
    <div class="card flat row between stamp">
      <div><div class="cap">Players</div><div class="d3" style="margin-top:2px">How many?</div></div>
      <div class="seg" style="width:170px" id="count"><button>2</button><button>3</button><button class="on">4</button></div>
    </div>

    <div>
      <span class="kicker" style="margin-bottom:10px;display:inline-block">Seats</span>
      <div class="players" id="players"></div>
    </div>

    <div class="card flat row between">
      <div><div class="cap">Game mode</div><div class="t" style="margin-top:2px">🎲 Classic rules</div></div>
      <button class="btn sm">Change</button>
    </div>

    <a class="bare mt-auto" href="game.html"><button class="btn btn--lime lg block">▶ Start Game</button></a>
  </div>
</div>
<script>
  const SEATS=[
    {c:'--seat0',face:'🦊',def:'You',human:true},
    {c:'--seat1',face:'🤖',def:'Bot Blue',human:false},
    {c:'--seat2',face:'🤖',def:'Bot Yellow',human:false},
    {c:'--seat3',face:'🤖',def:'Bot Green',human:false},
  ];
  let n=4;
  function render(){
    document.getElementById('players').innerHTML=SEATS.map((s,i)=>{
      const off=i>=n?' off':'';
      const color=getComputedStyle(document.documentElement).getPropertyValue(s.c);
      return `<div class="prow${off} pop" style="--d:${i*0.05}s">
        <div class="seatchip" style="background:${color}">${i+1}</div>
        <div class="ava" style="--sz:42px;--ring:${color}"><div class="face">${s.face}</div></div>
        <div class="nm"><b>${s.def}</b><span>${s.human?'Human · this device':'CPU opponent'}</span></div>
        ${i<n?(s.human?'<span class="badge">HOST</span>':`<div class="typeseg"><button class="on">BOT</button><button>HUMAN</button></div>`):'<span class="cap">empty</span>'}
      </div>`;
    }).join('');
  }
  document.getElementById('count').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
    n=+b.textContent; render();
  });
  render();
</script>
</body>
</html>
