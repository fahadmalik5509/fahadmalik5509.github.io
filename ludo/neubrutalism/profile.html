<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo · Profile</title>
<link rel="stylesheet" href="styles.css">
<style>
  .phead{position:relative;padding:22px 16px 18px;background:var(--yellow);border-bottom:var(--bd2) solid var(--ink);overflow:hidden}
  .phead .blk{position:absolute;border:3px solid var(--ink)}
  .phead .row1{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
  .phead .nm h1{font-family:'Archivo Black';font-size:26px;text-transform:uppercase;line-height:.9}
  .phead .nm .tag{font-family:'Space Mono';font-weight:700;font-size:12px;margin-top:6px}
  .lvlbar{margin-top:14px;position:relative;z-index:2}
  .lvlbar .lab{display:flex;justify-content:space-between;font-family:'Space Mono';font-weight:700;font-size:11px;text-transform:uppercase;margin-bottom:5px}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
  .stat{background:var(--white);border:var(--bd2) solid var(--ink);box-shadow:var(--sh-s);padding:12px;text-align:center}
  .stat .v{font-family:'Archivo Black';font-size:24px}
  .stat .k{font-family:'Space Mono';font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7a715b;margin-top:2px}
  .ach{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px}
  .medal{flex:none;width:74px;text-align:center}
  .medal .disc{width:60px;height:60px;margin:0 auto;border:var(--bd) solid var(--ink);box-shadow:var(--sh-s);display:grid;place-items:center;font-size:28px}
  .medal .l{font-size:10px;font-weight:800;text-transform:uppercase;margin-top:5px}
  .medal.lock .disc{background:var(--paper-2);filter:grayscale(1);opacity:.7}
</style>
</head>
<body>
<div class="app">
  <div class="bar-top" style="padding-bottom:0">
    <a class="bare" href="home.html"><button class="ibtn">←</button></a>
    <div class="ti">Profile</div>
    <a class="bare" href="settings.html"><button class="ibtn" style="margin-left:auto">⚙</button></a>
  </div>

  <div class="scroll">
    <div class="phead">
      <span class="blk float" style="right:-10px;top:-10px;width:54px;height:54px;background:var(--pink);transform:rotate(12deg)"></span>
      <span class="blk float" style="right:50px;bottom:-16px;width:34px;height:34px;background:var(--violet);animation-delay:.5s"></span>
      <div class="row1">
        <div class="ava wobblehover" style="--sz:74px;--ring:var(--white)"><div class="crown">👑</div><div class="face">🦊</div></div>
        <div class="nm grow">
          <h1>FoxTrot</h1>
          <div class="tag">⭐ GOLD TIER · LVL 12</div>
        </div>
        <a class="bare" href="customize.html"><button class="ibtn">✏</button></a>
      </div>
      <div class="lvlbar">
        <div class="lab"><span>Level 12</span><span>2,340 / 3,000 XP</span></div>
        <div class="bar"><i style="width:78%"></i></div>
      </div>
    </div>

    <div class="statgrid">
      <div class="stat pop" style="--d:.05s"><div class="v">148</div><div class="k">Games</div></div>
      <div class="stat pop" style="--d:.1s"><div class="v">92</div><div class="k">Wins</div></div>
      <div class="stat pop" style="--d:.15s"><div class="v">62%</div><div class="k">Win rate</div></div>
    </div>
    <div class="statgrid" style="padding-top:0">
      <div class="stat pop" style="--d:.2s;background:var(--lime)"><div class="v">×7</div><div class="k">Best streak</div></div>
      <div class="stat pop" style="--d:.25s;background:var(--cyan)"><div class="v">311</div><div class="k">Captures</div></div>
      <div class="stat pop" style="--d:.3s;background:var(--yellow)"><div class="v">12.4k</div><div class="k">Coins</div></div>
    </div>

    <div class="pad" style="padding-bottom:8px"><span class="kicker">Achievements</span></div>
    <div class="ach">
      <div class="medal"><div class="disc" style="background:var(--yellow)">🥇</div><div class="l">First Win</div></div>
      <div class="medal"><div class="disc" style="background:var(--pink)">🔥</div><div class="l">Streak 5</div></div>
      <div class="medal"><div class="disc" style="background:var(--cyan)">🎯</div><div class="l">100 Caps</div></div>
      <div class="medal lock"><div class="disc">🏆</div><div class="l">Champion</div></div>
      <div class="medal lock"><div class="disc">💎</div><div class="l">Big Spender</div></div>
    </div>
    <div style="height:16px"></div>
  </div>

  <div class="nav">
    <a href="home.html"><span class="ic">🏠</span>Home</a>
    <a href="friends.html"><span class="ic">👾</span>Friends</a>
    <a href="customize.html"><span class="ic">🎨</span>Shop</a>
    <a class="on" href="profile.html"><span class="ic">🦊</span>You</a>
  </div>
</div>
</body>
</html>
