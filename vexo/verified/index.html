<!--
  Vexo — email-verified landing page.
  Where Supabase redirects after a user clicks the verification link.
  Upload to: https://fahadmalik.me/vexo/verified
  Set as Supabase Auth → URL Configuration → Site URL.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vexo · Email verified</title>
  <style>
    :root {
      --surface:#f6f3ec; --raised:#ece8df; --ink:#1a1815; --ink-mute:#6b6760;
      --ink-soft:#aaa498; --rule:rgba(26,24,21,0.10); --accent:#65a30d; --accent-ink:#0a0a05;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface:#0c0b08; --raised:#18170f; --ink:#f3efe4; --ink-mute:#807c70;
        --ink-soft:#46433c; --rule:rgba(243,239,228,0.08); --accent:#84cc16; --accent-ink:#0a0a05;
      }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      background:var(--surface); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      display:flex; align-items:center; justify-content:center; min-height:100%;
      padding:24px;
    }
    .card {
      max-width:420px; width:100%; text-align:center;
      background:var(--raised); border:1px solid var(--rule);
      border-radius:16px; padding:40px 28px;
    }
    .eyebrow {
      font-family:'Courier New',monospace; font-size:12px; letter-spacing:2px;
      font-weight:600; color:var(--accent); margin-bottom:24px;
    }
    .check {
      width:64px; height:64px; border-radius:50%;
      background:rgba(101,163,13,0.14); color:var(--accent);
      display:flex; align-items:center; justify-content:center;
      font-size:32px; margin:0 auto 20px; line-height:1;
    }
    h1 {
      font-family:Georgia,'Times New Roman',serif; font-weight:500;
      font-size:26px; line-height:1.2; margin-bottom:12px;
    }
    p { color:var(--ink-mute); font-size:15px; line-height:1.6; margin-bottom:8px; }
    .hint { color:var(--ink-soft); font-size:13px; margin-top:20px; }
    .footer { margin-top:28px; font-family:'Courier New',monospace; font-size:11px;
      letter-spacing:1px; color:var(--ink-soft); }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">VEXO</p>
    <div class="check">&#10003;</div>
    <h1>Email verified</h1>
    <p>Your account is confirmed.</p>
    <p>Head back to the Vexo app and log in to start tracking everything you watch.</p>
    <p class="hint">You can close this tab.</p>
    <div class="footer">VEXO</div>
  </div>
</body>
</html>
